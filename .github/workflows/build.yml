name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        description: OddlyLabs/UniXNU ref (the fork whose catalog has FuxiFtsTouch)
        default: 1698acebb25f5be43db2c7048f63f4931b46f5f2
      xcode:
        description: Xcode version of the macos-26 image (the newest Xcode 26 if it is not installed)
        default: "26.6"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  UNIXNU_REPO: OddlyLabs/UniXNU
  UNIXNU_REF: ${{ inputs.unixnu_ref || '1698acebb25f5be43db2c7048f63f4931b46f5f2' }}
  XCODE: ${{ inputs.xcode || '26.6' }}

jobs:
  host-tests:
    name: Host tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: FuxiFtsTouch tests (gcc, clang; ASan, UBSan)
        run: |
          flags="-std=c11 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Werror -g -fsanitize=address,undefined"
          cd drivers/FuxiFtsTouch
          for cc in gcc clang; do
            for t in fts-protocol touch-core; do
              $cc $flags -I. Test/$t.c FtsProtocol.c FtsTouchCore.c -o /tmp/$t-$cc
              /tmp/$t-$cc
            done
          done
      - name: Board constants test
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Ipackage -Idrivers/FuxiFtsTouch tests/board_test.c \
            drivers/FuxiFtsTouch/FtsTouchCore.c -o /tmp/board_test
          /tmp/board_test
      - name: Scripts
        run: python3 -m py_compile scripts/*.py

  apple-clang:
    name: Kernel-target compile (Xcode clang)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Select Xcode
        run: |
          dir="/Applications/Xcode_${XCODE}.app"
          if [ ! -d "$dir" ]; then
            dir=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
            echo "::warning::Xcode ${XCODE} is not on this image; using ${dir:-none}. Installed: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ')"
          fi
          [ -n "$dir" ] && [ -d "$dir" ] || { echo "::error::no Xcode 26 on this image"; exit 1; }
          echo "DEVELOPER_DIR=$dir/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$dir/Contents/Developer" xcodebuild -version
      - name: Compile the C sources for arm64 iOS kernel code
        run: |
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          for f in drivers/FuxiFtsTouch/FtsProtocol.c drivers/FuxiFtsTouch/FtsTouchCore.c package/QcomRpmh.c; do
            xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -isysroot "$sdk" -mkernel -ffreestanding -std=c11 \
              -mgeneral-regs-only -Wall -Wextra -Wconversion -Werror -O2 -c "$f" -o "/tmp/$(basename "$f" .c).o"
          done
          # Kernel code must not call into libc: only the sources' own functions and what XNU itself provides.
          xcrun nm -u /tmp/FtsProtocol.o /tmp/FtsTouchCore.o
          undefined=$(xcrun nm -u /tmp/FtsProtocol.o /tmp/FtsTouchCore.o | grep -v ':$' | grep -v '^$' \
            | grep -vE '^_fts_|^_(memset|memcpy|memmove|bzero)$|^___bzero$|^___stack_chk_(guard|fail)$' || true)
          if [ -n "$undefined" ]; then echo "::error::unexpected imports: $undefined"; exit 1; fi

  kernel:
    name: fuxi kernel (XNU build and prelink)
    needs: host-tests
    runs-on: macos-26
    timeout-minutes: 240
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fuxi
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UNIXNU_REPO }}
          ref: ${{ env.UNIXNU_REF }}
          path: unixnu
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Select Xcode
        run: |
          dir="/Applications/Xcode_${XCODE}.app"
          if [ ! -d "$dir" ]; then
            dir=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
            echo "::warning::Xcode ${XCODE} is not on this image; using ${dir:-none}. Installed: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ')"
          fi
          [ -n "$dir" ] && [ -d "$dir" ] || { echo "::error::no Xcode 26 on this image"; exit 1; }
          echo "DEVELOPER_DIR=$dir/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$dir/Contents/Developer" xcodebuild -version
      - name: Install host tools
        run: |
          # The set UniXNU's macos.yml installs.
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          xcrun --sdk iphoneos --show-sdk-version
      - name: Select the device
        working-directory: unixnu
        run: ./unixnu defconfig fuxi_defconfig --device "$GITHUB_WORKSPACE/fuxi"
      - name: Build kernel
        working-directory: unixnu
        env:
          # prepare-xnu-source.py lists Apple sources through the GitHub API (anonymous calls hit the shared rate limit).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu build kernel --device "$GITHUB_WORKSPACE/fuxi"
          ./unixnu status --device "$GITHUB_WORKSPACE/fuxi" --json > "$RUNNER_TEMP/unixnu-status.json" || true
      - name: Check the touch probe in the kernel
        run: |
          kernel=$(find unixnu/out -path '*/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf' | head -n 1)
          [ -n "$kernel" ] || { echo "::error::linked kernel not found"; exit 1; }
          ls -l "$kernel"
          # Read the symbol table once: grep -q on a pipe would stop nm early (SIGPIPE) and pipefail would report a miss.
          nm "$kernel" > "$RUNNER_TEMP/kernel-symbols.txt"
          missing=0
          for s in _native_touch_probe _native_touch_set_sink _fts_reset _fts_touch_apply _geni_spi_transfer _qcom_rpmh_active_request; do
            line=$(grep -E " [Tt] $s\$" "$RUNNER_TEMP/kernel-symbols.txt" || true)
            if [ -n "$line" ]; then echo "defined: $line"; else echo "::error::missing from the kernel: $s"; missing=1; fi
          done
          # bsd_init must call the probe (patches/xnu/fuxi-touch-probe.patch): look for the call in its disassembly.
          "$(brew --prefix llvm)/bin/llvm-objdump" --disassemble-symbols=_bsd_init "$kernel" > "$RUNNER_TEMP/bsd_init.txt"
          if grep -q '_native_touch_probe' "$RUNNER_TEMP/bsd_init.txt"; then
            echo "bsd_init: $(grep -m 1 '_native_touch_probe' "$RUNNER_TEMP/bsd_init.txt")"
          else
            echo "::error::bsd_init does not call native_touch_probe"; missing=1
          fi
          prelinked=$(find unixnu/out -path '*/kernel/kernel.macho' | head -n 1)
          if [ -n "$prelinked" ]; then ls -l "$prelinked"; shasum -a 256 "$prelinked"; else echo "::error::no prelinked kernel"; missing=1; fi
          exit $missing
      - name: Collect the text logs
        if: always()
        run: |
          # Only text files leave the runner: the kernel, the kernelcache and IPSW members derive from Apple software.
          mkdir -p "$RUNNER_TEMP/logs"
          find unixnu/out -path '*/logs/*.log' -size -20M -exec cp {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true
          cp "$RUNNER_TEMP/unixnu-status.json" "$RUNNER_TEMP/logs/" 2>/dev/null || true
          [ -f fuxi/unixnu.lock ] && cp fuxi/unixnu.lock "$RUNNER_TEMP/logs/unixnu.lock" || true
          ls -l "$RUNNER_TEMP/logs"
      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuxi-kernel-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/logs/*.log
            ${{ runner.temp }}/logs/*.json
            ${{ runner.temp }}/logs/unixnu.lock
          if-no-files-found: warn
          retention-days: 7
      - name: Remove proprietary inputs
        if: always()
        run: rm -rf unixnu/out/ipsw unixnu/out/feeds fuxi/.cache/firmware
