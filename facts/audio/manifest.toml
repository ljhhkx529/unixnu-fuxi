schema_version = 1
board = "fuxi"
soc = "sm8550"
status = "source-confirmed"

[source]
repository = "https://github.com/LineageOS/android_kernel_xiaomi_sm8550-devicetrees"
revision = "43b5ada5654ed84c25f74789bc8f6326b7bacd20"
kind = "fixed-fuxi-source"
limits = "The fixed fuxi source establishes board wiring, not runtime state, stream format, calibration, or successful audio."

[speaker_bus]
controller = "qupv3_se8_i2c"
wrapper = "qupv3_2"
serial_engine = 0
mmio_base = 0x00880000
mmio_size = 0x4000
sda_gpio = 0
scl_gpio = 1
source = "qcom/fuxi-sm8550.dtsi:243-290; qcom/kalama-qupv3.dtsi:535-550; qcom/kalama-pinctrl.dtsi:1231-1271"
runtime_verified = false


[[amplifier]]
role = "B"
compatible = "cirrus,cs35l41"
i2c_address = 0x40
reset_gpio = 183
irq_gpio = 99
irq_flags = 0x2008
right_channel_amp = true
asp_sdout_hiz = 3
boost_peak_milliamp = 4000
boost_cap_microfarad = 15
boost_ind_nanohenry = 1000
profile_names = ["B-music.txt", "B-handfree.txt"]
source = "qcom/fuxi-sm8550.dtsi:245-266; qcom/fuxi-pinctrl.dtsi:3-15,31-42"
runtime_verified = false

[[amplifier]]
role = "T"
compatible = "cirrus,cs35l41"
i2c_address = 0x42
reset_gpio = 182
irq_gpio = 98
irq_flags = 0x2008
right_channel_amp = false
asp_sdout_hiz = 3
boost_peak_milliamp = 4000
boost_cap_microfarad = 15
boost_ind_nanohenry = 1000
profile_names = ["T-music.txt", "T-handset.txt", "T-handfree.txt"]
receiver_select_gpio = 68
source = "qcom/fuxi-sm8550.dtsi:267-289; qcom/fuxi-pinctrl.dtsi:17-28,44-55; qcom/fuxi-sm8550.dtsi:83-116"
runtime_verified = false

[speaker_link]
interface = "secondary-tdm-mi2s"
clock_gpio = 121
word_select_gpio = 123
data_input_gpio = 122
data_output_gpio = 124
max_slots = 4
soc_is_clock_master = "unverified"
sample_rate = "unverified"
sample_width = "unverified"
slot_width = "unverified"
slot_masks = "unverified"
source = "qcom/audio/xiaomi-sm8550-common.dtsi:59-79; qcom/kalama-pinctrl.dtsi:2944-3059"
runtime_verified = false

[codec]
compatible = "qcom,wcd938x-codec"
tx_soundwire_mmio = 0x06d30000
reset_gpio = 108
micbias_millivolt = [2750, 2750, 2750, 2750]
micbias_supply_min_microvolt = 3296000
micbias_supply_max_microvolt = 3960000
source = "qcom/audio/kalama-audio-overlay.dtsi:42-115,325-365; qcom/audio/xiaomi-sm8550-common.dtsi:96-102; qcom/kalama-pinctrl.dtsi:3298-3323"
runtime_verified = false

[microphone_route]
primary_mic = "unverified"
micbias = "unverified"
adc = "unverified"
soundwire_slave_port = "unverified"
soundwire_channel = "unverified"
master_port = "unverified"
tx_decimator = "unverified"
codec_dma_endpoint = "unverified"
source = "qcom/audio/fuxi-audio-mtp.dtsi:3-55 only lists candidate routes"
runtime_verified = false

[adsp]
# The container the peripheral authentication service takes: an ELF whose program headers carry the segment
# types, with the hash segment it authenticates. This is the protocol, not a fuxi value.
firmware_container = "elf32-or-elf64-with-hash-segment"
firmware_container_source = "QcomMdt: qcom_mdt_parse/qcom_mdt_metadata, host-tested by scripts/check-qcom-mdt-host.py"
firmware_source = "unverified"
firmware_hash = "unverified"
carveout = "unverified"
glink_channel = "adsp_apps"
glink_channel_source = "SM8550 architecture reference; it must be confirmed for the selected fuxi firmware before use"
runtime_verified = false

[safety]
default_amplifier_state = "reset-or-global-mute"
allow_high_power_without_protection = false
allow_cross_device_calibration = false
allow_cs35l43_register_program = false
first_tone_max_milliseconds = 500
first_tone_requires_attenuation = true

# A reference implementation on the same SoC, recorded as the source of the predictions below. It is not evidence about
# this board: it says what the platform looks like on sheng, and every value taken from it stays unverified here until
# fuxi's own measurement replaces it.
[sheng]
sm8550 = "unverified"
reference = "UniXNU-sheng package/AdspProbe.cpp: kAdspBase 0x9ea00000 + 0x4680000, kDtbBase 0x9e980000 + 0x80000, PAS 1 and 36, remote pid 2, SMP2P entries master-kernel (stop, bit 0) and slave-kernel (fatal 0, ready 1, handover 2, stop ack 3), GLINK channel adsp_apps, SMEM items in 443 / out 429 / crash 423 / glink 478-480, glink FIFO 0x4000, load-state request {class: image, res: load_state, name: adsp, val: on}"

# The first device evidence: the read-only SMEM probe (package/FuxiAudioProbe.cpp) run on 2026-11-09 with
# fuxi-audio-probe=1, read out of the USB CDC capture (/tmp/fuxi-usb/run-20261109-004302). It writes nothing.
[probe]
runtime_verified = true
when = "2026-11-09"
image = "probe build of the fuxi tree, kernel.macho sha256 afb4edb6, boot argument fuxi-audio-probe=1"
smem_base = 0x81d00000
smem_parsed = true
apps_adsp_partition_offset = 0x19f000
apps_adsp_partition_size = 0x60000
apps_adsp_cacheline = 32
global_partition_offset = 0x1000
global_partition_size = 0xb0000
item_glink_descriptor = "allocated: 32 bytes at offset 0x19f030"
item_glink_tx = "allocated: 16384 bytes at offset 0x19f060"
items_absent = "429 (SMP2P out), 443 (SMP2P in), 423 (crash) and 480 (GLINK rx) are not allocated, which is what a read-only probe sees before the APPS side creates them"
note = "The boot loader already allocated the GLINK descriptor and the transmit FIFO, at the size the platform documents (0x4000), but both read back all zeros on 2026-11-09 (words: 00000000 x8 each): the items exist and are empty, because the GLINK protocol has never run on this board. The probe also exercised package/QcomSmem.c against this board's table, which had only ever run against the host model."
second_run = "2026-11-09, kernel e227629d, hex dump of items 478 and 479"
third_run = "2026-11-09, kernel ea639b7c, partition enumerated: the APPS/ADSP partition holds exactly two uncached items, 478 (the GLINK descriptor, 32 bytes at 0x19f030) and 479 (the transmit FIFO, 16384 bytes at 0x19f060). Nothing else is allocated: the SMP2P out and in items, the crash item and the GLINK receive FIFO do not exist until the APPS side creates them, which is what a bring-up does and what a read-only probe must not. The phone stayed up after the run (the USB control channel answered a ping), so a probe run costs nothing."

# The board's own device tree, decompiled from the blob the boot image is built with. This establishes where the mutex
# block is and which lock SMEM uses; it does not establish the register encoding, which is the driver's semantics, and it
# is not a runtime measurement, so nothing below can make a binding field verified.
[hwlock]
tcsr_base = 0x1f40000
tcsr_size = 0x20000
syscon_offset = 0x0
syscon_size = 0x1000
smem_lock_id = 3
compatible = "qcom,tcsr-mutex"
source = "uefi-fuxi/Platforms/Xiaomi/fuxiPkg/FdtBlob/sm8550-xiaomi-fuxi.dtb, decompiled: tcsr_mutex_block reg = <0x1f40000 0x20000>; tcsr_mutex syscon = <tcsr_mutex_block 0x0 0x1000>; smem hwlocks = <&tcsr_mutex 3>"
runtime_verified = false

# The encoding, from the mainline driver rather than from guesswork. Verified against
# drivers/hwspinlock/qcom_hwspinlock.c at torvalds/linux@7475ea8b58616b33c04afb976cf0fbaad9dd63fb: the tcsr-mutex match
# data uses offset 0 and stride 0x1000 for 32 locks, the whole 32-bit register is the lock, acquiring writes the processor
# id and confirms it by reading back, and releasing writes zero.
encoding_source = "drivers/hwspinlock/qcom_hwspinlock.c @ torvalds/linux 7475ea8b58616b33c04afb976cf0fbaad9dd63fb"
locks_per_bank = 32
apps_proc_id = 1
lock_stride = 0x1000
smem_lock_register = 0x1f43000
acquire_value = 1
release_value = 0
acquire_reads_back = true

# An independent fuxi Linux port that has the speakers working on this board. Its device tree is a second, agreeing source
# for the wiring the vendor tree already gave us, and the only source so far for the DAI the APM graph has to address and
# for the amplifier bus settings the vendor tree leaves implicit.
[linux_port]
repository = "https://github.com/ilovecnxx/xiaomi13-fuxi-linux-ubuntu26.10-kernel7.3"
revision = "7f12106b4ce4ae1db7eeb4df509a4818879e9276"
kind = "independent-fuxi-port"
files = "work/patches/audio-bringup-20261029/audio.dtsi.before; work/patches/audio-bringup-20261029/audio-fixes.patch; kernel/patches/0004-audio.patch"
limits = "Establishes fuxi's audio wiring and the Linux DAI/card names. It says nothing about our XNU path, about APM command ids, or about runtime state."
# Each number is its own key so the binding gate can compare a value with a value instead of reading prose.
i2c8_mmio_base = 0x00880000
i2c8_frequency_hz = 400000
i2c8_sda_gpio = 0
i2c8_scl_gpio = 1
mi2s_sck_gpio = 121
mi2s_ws_gpio = 123
mi2s_data_out_gpio = 124
mi2s_data_in_gpio = 122
mi2s_port_id = 0x12      # SECONDARY_MI2S_RX = 0x12 (18 decimal). The device tree writes the unit address as dai@12, which is hex.
ar_dai_index = 18        # the topology's AR_TKN_DAI_INDEX token for this DAI, same 18 written in decimal
hw_if_index = 1          # I2S_INTF_TYPE_SECONDARY, the i2s module's HW_IF_IDX token
sd_line_index = 2        # SD_LINE_IDX: SD1, which is GPIO124 i2s1_data1
logger_device = 16       # the topology's device16: logger1 to i2s_rx1 is the playback path that was retargeted
chan_amp_b = 1   # mono codecs in device tree order: first is left, second is right, and B is second
chan_amp_t = 0   # T is first in the device tree, so it is the left channel
codec_channel_order = "mono codecs in device tree order: first left, second right (T is left, B is right)"
volume_cap_0db = 816     # the machine driver caps both PCM volumes at 0 dB while the protection firmware runs
amp_gpio2_src_select = 4
amp_gpio2_output_enable = 1
i2c_instance = "i2c8 (QUP2 SE0) at 0x00880000, 400 kHz, on GPIO0/GPIO1 (mirb pair)"
i2s_instance = "TLMM I2S1, SCK GPIO121, WS GPIO123, DATA1 GPIO124 out, DATA0 GPIO122 in, LPASS is BCLK/WS master"
mi2s_port_name = "SECONDARY_MI2S_RX"
bclk_clock = "LPASS_CLK_ID_SEC_MI2S_IBIT, LPASS_CLK_ATTRIBUTE_COUPLE_NO"
card = "xiaomi,fuxi-sndcard model Xiaomi-13, topology qcom/sm8550/Xiaomi-13-tplg.bin"
amp_dsp_firmware = "cirrus/cs35l41-dsp1-spk-prot-xiaomi-fuxi-B.{wmfw,bin} and the T counterpart"
earpiece_mux_gpio = 68
runtime_verified = false

# The amplifier's register addresses, from the mainline driver rather than from a datasheet transcription. Each one below
# has an exact name in include/sound/cs35l41.h at torvalds/linux@7475ea8b58616b33c04afb976cf0fbaad9dd63fb, and the global
# enable is cited to the code that writes it: regmap_update_bits(regmap, CS35L41_PWR_CTRL1, CS35L41_GLOBAL_EN_MASK, ...)
# in sound/soc/codecs/cs35l41-lib.c. Nothing here says what our own driver will write into them.
[linux_cs35l41]
source = "include/sound/cs35l41.h and sound/soc/codecs/cs35l41-lib.c @ torvalds/linux 7475ea8b58616b33c04afb976cf0fbaad9dd63fb"
device_id = 0x00000000        # CS35L41_DEVID
revision = 0x00000004         # CS35L41_REVID
global_enables = 0x00002014   # CS35L41_PWR_CTRL1, global enable is bit 0 (CS35L41_GLOBAL_EN_MASK)
boost_peak = 0x00003808       # CS35L41_BSTCVRT_PEAK_CUR
pll_ctrl = 0x00002C04         # CS35L41_PLL_CLK_CTRL
mute = 0x00002024             # CS35L41_AMP_OUT_MUTE
irq1_mask1 = 0x00010110       # CS35L41_IRQ1_MASK1
block_enables = 0x00002018    # CS35L41_PWR_CTRL2: the register whose bits the driver toggles for boost, the monitors and the main amplifier
asp_ctrl = 0x00004854         # CS35L41_ASP_CONTROL4, the only ASP control register the header names
boost_cap = 0x00003810        # CS35L41_BSTCVRT_COEFF: the capacitor is configured through the boost converter's coefficients
irq1_status1 = 0x00010010     # CS35L41_IRQ1_STATUS1: polled for pump-up and written to clear
irq1_status2 = 0x00010014     # CS35L41_IRQ1_STATUS2: the second status word the driver reads
unnamed = "One field remains without a register of its own: the ASP enable masks this project expected as a separate register are bits inside ASP_CONTROL4, so reg_asp_enables names something the part does not have separately. The field is kept until the code that uses it decides whether to drop it. The two EINT fields are the driver's IRQ1_STATUS1/STATUS2 under this project's older naming, and the boost capacitor is configured through BSTCVRT_COEFF rather than a register of its own."
runtime_verified = false

# The AudioReach protocol constants the graph has to address, from the mainline qdsp6 headers rather than from a
# transcription. The interface type independently confirms the Linux port's topology script, which retargets the playback
# path by setting HW_IF_IDX to 1 - the same 1 this header calls I2S_INTF_TYPE_SECONDARY.
[audioreach]
source = "sound/soc/qcom/qdsp6/audioreach.h @ torvalds/linux 7475ea8b58616b33c04afb976cf0fbaad9dd63fb"
wr_shared_mem_ep_module = 0x07001000
rd_shared_mem_ep_module = 0x07001001
i2s_sink_module = 0x0700100A
i2s_source_module = 0x0700100B
gain_module = 0x07001002
i2s_intf_type_primary = 0
i2s_intf_type_secondary = 1
param_id_i2s_intf_cfg = 0x08001019
i2s_ws_src_external = 0x0             # CONFIG_I2S_WS_SRC_EXTERNAL
i2s_ws_src_internal = 0x1             # CONFIG_I2S_WS_SRC_INTERNAL: the interface drives the word select itself
i2s_sd0 = 1                           # I2S_SD0, and I2S_SD1 is 2 - which independently confirms the port script's SD_LINE_IDX 2
i2s_sd1 = 2
apm_sg_sid_audio_playback = 0x1      # APM_SUB_GRAPH_SID_AUDIO_PLAYBACK: the scenario id for a playback subgraph
apm_sg_sid_audio_record = 0x2        # APM_SUB_GRAPH_SID_AUDIO_RECORD, for the capture path later
graph_direction_playback = 0         # q6apm.c compares cfg->direction against SNDRV_PCM_STREAM_CAPTURE(1), so playback is 0
module_instance_start = 0x00006000
container_instance_start = 0x00005000
subgraph_instance_start = 0x00004000
runtime_verified = false
