# The fuxi binding for every audio layer, field by field.
#
# Each entry carries the value a build would use, the state of that value, and the fact it rests on.
# state is unverified until a device measurement supports it, and evidence is either a key in
# facts/audio/manifest.toml or none. scripts/check-fuxi-audio-binding.py refuses a verified entry whose
# evidence is missing or still unverified, so an unverified value cannot quietly reach an image.

schema_version = 1
board = "fuxi"
status = "source-confirmed"

[adsp.carveout]
carveout_base = { value = 0x9ea00000, state = "unverified", evidence = "sheng.sm8550" }
carveout_size = { value = 0x04680000, state = "unverified", evidence = "sheng.sm8550" }

[adsp.entries]
state_entry = { value = "master-kernel", state = "unverified", evidence = "sheng.sm8550" }
ready_entry = { value = "slave-kernel", state = "unverified", evidence = "sheng.sm8550" }
fatal_entry = { value = "slave-kernel", state = "unverified", evidence = "sheng.sm8550" }
load_state_message = { value = "{class: image, res: load_state, name: adsp, val: on}", state = "unverified", evidence = "sheng.sm8550" }

[adsp.values]
ready_value = { value = 0x2, state = "unverified", evidence = "sheng.sm8550" }
fatal_value = { value = 0x1, state = "unverified", evidence = "sheng.sm8550" }

[adsp.timeouts]
mailbox_timeout = { value = 1000, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#timeouts" }
ready_timeout = { value = 2000, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#timeouts" }
link_timeout = { value = 5000, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#timeouts" }

[path]
gpr_port = { value = 0x2001, state = "unverified", evidence = "sheng.sm8550" }
token_seed = { value = 1, state = "unverified", evidence = "sheng.sm8550" }
timeout_steps = { value = 100, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#timeouts" }
stream_instance = { value = 0x6001, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#ar-ids" }
buffer_address = { value = 0, state = "unverified", evidence = "none" }
buffer_bytes = { value = 0x10000, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#path-buffer" }
periods_in_flight = { value = 2, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#path-periods-in-flight" }

[path.references]

[path.graph]
