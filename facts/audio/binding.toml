[amp.b]
channel = { value = 1, state = "unverified", evidence = "linux_port.chan_amp_b" }
i2c_address = { value = 0x40, state = "unverified", evidence = "amplifier[0].i2c_address" }
reset_gpio = { value = 183, state = "unverified", evidence = "amplifier[0].reset_gpio" }
irq_gpio = { value = 99, state = "unverified", evidence = "amplifier[0].irq_gpio" }

[amp.t]
