ar_dai_index = { value = 18, state = "unverified", evidence = "linux_port.ar_dai_index" }
hw_if_index = { value = 1, state = "unverified", evidence = "linux_port.hw_if_index" }
sd_line_index = { value = 2, state = "unverified", evidence = "linux_port.sd_line_index" }
logger_device = { value = 16, state = "unverified", evidence = "linux_port.logger_device" }
[abi]
rate = { value = 48000, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#abi-rate" }
out_channels = { value = 2, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#abi-channels" }
in_channels = { value = 2, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#abi-channels" }
period_frames = { value = 480, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#abi-period" }
ring_frames = { value = 4800, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#abi-period" }
lead_frames = { value = 960, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#abi-period" }
host_clock_hz = { value = 24000000, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#abi-host-clock" }
anchor_host = { value = 0, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#abi-host-clock" }

[capture]
channels = { value = 2, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#capture" }
bit_width = { value = 16, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#capture" }
period_frames = { value = 480, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#capture" }
sample_rate = { value = 48000, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#capture" }
expected_periods = { value = 200, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#capture" }


# The part's registers and the values this board programs into them.
[amp.registers]
reg_device_id = { value = 0x00000000, state = "unverified", evidence = "linux_cs35l41.device_id" }
reg_revision = { value = 0x00000004, state = "unverified", evidence = "linux_cs35l41.revision" }
reg_global_enables = { value = 0x00002014, state = "unverified", evidence = "linux_cs35l41.global_enables" }
reg_block_enables = { value = 0x00002018, state = "unverified", evidence = "linux_cs35l41.block_enables" }
reg_asp_enables = { value = 0, state = "unverified", evidence = "none" }
reg_asp_ctrl = { value = 0, state = "unverified", evidence = "none" }
reg_boost_peak = { value = 0x00003808, state = "unverified", evidence = "linux_cs35l41.boost_peak" }
reg_boost_cap = { value = 0, state = "unverified", evidence = "none" }
reg_pll_ctrl = { value = 0x00002C04, state = "unverified", evidence = "linux_cs35l41.pll_ctrl" }
reg_mute = { value = 0x00002024, state = "unverified", evidence = "linux_cs35l41.mute" }
reg_irq1_eint1 = { value = 0, state = "unverified", evidence = "none" }
reg_irq1_eint2 = { value = 0, state = "unverified", evidence = "none" }
reg_irq1_mask1 = { value = 0x00010110, state = "unverified", evidence = "linux_cs35l41.irq1_mask1" }
device_id_value = { value = 0, state = "unverified", evidence = "none" }
revision_value = { value = 0, state = "unverified", evidence = "none" }
enable_value = { value = 1, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#amp-write-values" }
asp_slot_value = { value = 0, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#amp-write-values" }
boost_peak_value = { value = 4000, state = "unverified", evidence = "amplifier[0].boost_peak_milliamp" }
boost_cap_value = { value = 15, state = "unverified", evidence = "amplifier[0].boost_cap_microfarad" }
pll_value = { value = 1, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#amp-write-values" }
irq_mask_value = { value = 0, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#amp-write-values" }
mute_on = { value = 1, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#amp-mute-polarity" }
mute_off = { value = 0, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#amp-mute-polarity" }
