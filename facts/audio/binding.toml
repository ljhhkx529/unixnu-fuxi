interleaving = { value = 0, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#path-format" }
bytes_per_frame = { value = 4, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#path-format" }

[path.ring]
frames = { value = 65536, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#path-ring" }
period_frames = { value = 480, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#path-ring" }
channels = { value = 2, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#path-ring" }
bytes_per_sample = { value = 2, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#path-ring" }
sample_rate = { value = 48000, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#path-ring" }
host_clock_hz = { value = 24000000, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#path-ring" }

[path.topology]
stream_instance = { value = 0x6001, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#ar-ids" }
stream_module = { value = 0x07001000, state = "unverified", evidence = "audioreach.wr_shared_mem_ep_module" }
endpoint_instance = { value = 0x6002, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#ar-ids" }
shmem_instance = { value = 0x6003, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#ar-ids" }
endpoint_module = { value = 0x0700100A, state = "unverified", evidence = "audioreach.i2s_sink_module" }
sample_rate = { value = 0, state = "unverified", evidence = "none" }
slot_mask_a = { value = 0, state = "unverified", evidence = "none" }
slot_mask_b = { value = 0, state = "unverified", evidence = "none" }
slot_count = { value = 0, state = "unverified", evidence = "none" }
shmem_module = { value = 0, state = "unverified", evidence = "none" }
interface_word = { value = 0, state = "unverified", evidence = "none" }

# The block the kernel service and the user-space HAL share. Offsets are part of the ABI; the values are board facts.
