# The fuxi binding for every audio layer, field by field.
#
# Each entry carries the value a build would use, the state of that value, and the fact it rests on.
# state is unverified until a device measurement supports it, and evidence is either a key in
# facts/audio/manifest.toml or none. scripts/check-fuxi-audio-binding.py refuses a verified entry whose
# evidence is missing or still unverified, so an unverified value cannot quietly reach an image.

schema_version = 1
board = "fuxi"
status = "source-confirmed"

[adsp.carveout]
carveout_base = { value = 0, state = "unverified", evidence = "adsp.carveout" }
carveout_size = { value = 0, state = "unverified", evidence = "adsp.carveout" }

[adsp.entries]
state_entry = { value = "", state = "unverified", evidence = "none" }
ready_entry = { value = "", state = "unverified", evidence = "none" }
fatal_entry = { value = "", state = "unverified", evidence = "none" }
load_state_message = { value = "", state = "unverified", evidence = "none" }

[adsp.values]
ready_value = { value = 0, state = "unverified", evidence = "none" }
fatal_value = { value = 0, state = "unverified", evidence = "none" }

[adsp.timeouts]
