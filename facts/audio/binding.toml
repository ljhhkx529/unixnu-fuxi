apm_iid = { value = 1, state = "unverified", evidence = "sheng.sm8550" }
subgraph_id = { value = 1, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#ar-ids" }
performance = { value = 0, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#graph-performance" }
direction = { value = 0, state = "unverified", evidence = "none" }
scenario = { value = 0, state = "unverified", evidence = "none" }
container_id = { value = 1, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#ar-ids" }
container_position = { value = 0, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#ar-ids" }
container_stack_bytes = { value = 0x4000, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#graph-performance" }
container_domain = { value = 0, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#ar-ids" }
module_count = { value = 3, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#ar-ids" }
link_count = { value = 2, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#ar-ids" }

[path.endpoint]
module = { value = 0x0700100A, state = "unverified", evidence = "audioreach.i2s_sink_module" }
instance = { value = 0x6002, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#ar-ids" }
interface_type = { value = 1, state = "unverified", evidence = "audioreach.i2s_intf_type_secondary" }
interface_index = { value = 0, state = "unverified", evidence = "none" }
secondary = { value = 0, state = "unverified", evidence = "none" }
line = { value = 2, state = "unverified", evidence = "linux_port.sd_line_index" }
ws_source = { value = 0, state = "unverified", evidence = "none" }
slot_mask = { value = 0, state = "unverified", evidence = "none" }

[path.format]
media = { value = 0, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#path-format" }
bit_width = { value = 16, state = "chosen", evidence = "design:docs/fuxi-audio-abi-choices.md#path-format" }
