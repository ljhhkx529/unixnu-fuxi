# The fuxi binding for the Qualcomm baseband (MPSS), field by field.
#
# Each entry carries the value a build would use, the state of that value, and the fact it rests on.
# state is one of:
#   confirmed  a first-hand source states this value for this board or this SoC
#   inferred   a first-hand source states it for another board on the same SoC, and nothing contradicts it here
#   chosen     the value is ours to pick; the evidence is the design decision itself
#   unverified nothing supports it yet
# evidence is either a key in facts/baseband/manifest.toml or "none". Unlike the audio binding, a
# confirmed value needs no device measurement: the source is the Linux kernel's own table for this
# SoC, which is what the modem's firmware and the secure world actually implement.

schema_version = 1
board = "fuxi"
soc = "sm8550"
status = "source-confirmed"

# The two images the secure world loads for the modem. The image is PAS id 4 and the modem's own
# device tree blob is PAS id 0x26 (38): Linux's drivers/remoteproc/qcom_q6v5_pas.c, the
# sm8550_mpss_resource entry.
[pas]
modem = { value = 4, state = "confirmed", evidence = "linux.qcom_q6v5_pas.sm8550_mpss" }
modem_dtb = { value = 0x26, state = "confirmed", evidence = "linux.qcom_q6v5_pas.sm8550_mpss" }
proxy_pd_names = { value = ["cx", "mss"], state = "confirmed", evidence = "linux.qcom_q6v5_pas.sm8550_mpss" }
load_state = { value = "modem", state = "confirmed", evidence = "linux.qcom_q6v5_pas.sm8550_mpss" }
firmware_name = { value = "modem.mdt", state = "confirmed", evidence = "linux.qcom_q6v5_pas.sm8550_mpss" }
dtb_firmware_name = { value = "modem_dtb.mdt", state = "confirmed", evidence = "linux.qcom_q6v5_pas.sm8550_mpss" }

# The memory the modem runs from. The image region and the device tree blob region are the two
# reserved-memory nodes Linux's sm8550.dtsi declares for the modem.
[carveout]
image_base = { value = 0x8a800000, state = "confirmed", evidence = "linux.sm8550.dtsi.mpss_region" }
image_size = { value = 0x10800000, state = "confirmed", evidence = "linux.sm8550.dtsi.mpss_region" }
dtb_base = { value = 0x9b000000, state = "confirmed", evidence = "linux.sm8550.dtsi.mpss_dtb_region" }
dtb_size = { value = 0x80000, state = "confirmed", evidence = "linux.sm8550.dtsi.mpss_dtb_region" }

# The SMEM partition the modem and the AP share, and the GLINK items on it. The item ids are the
# ones Linux uses for every GLINK edge (drivers/rpmsg/qcom_glink_smem.c): the native transport
# descriptor 478, FIFO_0 479 and FIFO_1 480. The AP allocates the descriptor and FIFO_0; FIFO_1 is
# the modem's.
[smem]
base = { value = 0x81d00000, state = "inferred", evidence = "sheng.sm8550" }
size = { value = 0x200000, state = "inferred", evidence = "sheng.sm8550" }
remote_pid = { value = 1, state = "confirmed", evidence = "linux.qcom_glink_smem" }
glink_desc_item = { value = 478, state = "confirmed", evidence = "linux.qcom_glink_smem" }
glink_tx_item = { value = 479, state = "confirmed", evidence = "linux.qcom_glink_smem" }
glink_rx_item = { value = 480, state = "confirmed", evidence = "linux.qcom_glink_smem" }
glink_fifo_bytes = { value = 0x4000, state = "confirmed", evidence = "linux.qcom_glink_smem" }

# The channel the modem opens for QRTR, and the intent size it grants on it. The name comes from
# the modem's own glink-edge node (qcom,modem_qrtr, channel "IPCRTR") and the size from the same
# class of edge's intent.
[glink]
channel = { value = "IPCRTR", state = "confirmed", evidence = "caf.fuxi_live_dts.modem_qrtr" }
intent_size = { value = 4096, state = "inferred", evidence = "caf.fuxi_live_dts.modem_qrtr" }
intent_count = { value = 8, state = "chosen", evidence = "design:facts/baseband/manifest.toml#intents" }

# The doorbell the modem rings, and the IPCC client it uses. The modem is IPCC client 2 (MPSS),
# not the ADSP's 3 (LPASS): the modem's glink-edge and its SMP2P both ring on MPSS.
[ipcc]
client = { value = 2, state = "confirmed", evidence = "linux.qcom_ipcc" }
glink_signal = { value = 0, state = "confirmed", evidence = "linux.qcom_ipcc" }
smp2p_signal = { value = 2, state = "confirmed", evidence = "linux.qcom_ipcc" }
base = { value = 0x408000, state = "inferred", evidence = "sheng.sm8550" }
spi = { value = 229, state = "inferred", evidence = "sheng.sm8550" }

# The SMP2P pair. The device tree gives them as {inbound, outbound}, so the AP writes 0x1ac and
# reads 0x1b3. The inbound item is created by the modem, not the AP: the AP only looks for it.
[smp2p]
out_item = { value = 0x1ac, state = "confirmed", evidence = "caf.fuxi_live_dts.smp2p_modem" }
in_item = { value = 0x1b3, state = "confirmed", evidence = "caf.fuxi_live_dts.smp2p_modem" }
ready_entry = { value = "slave-kernel", state = "confirmed", evidence = "caf.fuxi_live_dts.modem_remoteproc" }
fatal_entry = { value = "slave-kernel", state = "confirmed", evidence = "caf.fuxi_live_dts.modem_remoteproc" }
ready_bit = { value = 0x2, state = "confirmed", evidence = "linux.sm8550.dtsi.smp2p_modem_in" }
fatal_bit = { value = 0x1, state = "confirmed", evidence = "linux.sm8550.dtsi.smp2p_modem_in" }

# The two RPMh proxy power domains the modem needs. The modem's remoteproc asks for "cx.lvl" and
# "mss.lvl"; both are in this board's own command database, confirmed by reading it on the device
# on 2026-11-19 (the fuxi-modem=3 probe).
[rails]
cx = { value = "cx.lvl", state = "confirmed", evidence = "linux.qcom_q6v5_pas.sm8550_mpss" }
mss = { value = "mss.lvl", state = "confirmed", evidence = "caf.fuxi_live_dts.mss_rail" }
cx_in_cmd_db = { value = true, state = "confirmed", evidence = "device.cmd_db.modem_rails" }
mss_in_cmd_db = { value = true, state = "confirmed", evidence = "device.cmd_db.modem_rails" }
cx_address = { value = 0x30000, state = "confirmed", evidence = "device.cmd_db.modem_rails" }
mss_address = { value = 0x30060, state = "confirmed", evidence = "device.cmd_db.modem_rails" }
cx_level_count = { value = 10, state = "confirmed", evidence = "device.cmd_db.modem_rails" }
mss_level_count = { value = 7, state = "confirmed", evidence = "device.cmd_db.modem_rails" }

# The RPMh corner the modem's two domains are voted to, and which of the three vote states
# each one takes. Linux's sm8550_mpss_resource carries no proxy_pd_performance_states, so
# qcom_pas_pds_enable asks for INT_MAX, and rpmhpd_set_performance_state clamps that to the
# highest corner. The enable corner (the first non-zero level with Retention skipped) never
# exceeds it, and the unsynced branch of rpmhpd_aggregate_corner gives the same corner, so the
# vote is the highest corner either way. cx has a peer (cx_ao) and so is recorded in all three
# vote states; mss has none and so in one. Only the active one reaches the wire: the wake and
# sleep votes are cached in rpmh.c and flushed when the processor suspends.
[vote]
cx_corner = { value = "highest", state = "confirmed", evidence = "linux.rpmhpd.set_performance_state" }
mss_corner = { value = "highest", state = "confirmed", evidence = "linux.rpmhpd.set_performance_state" }
retention_level = { value = 16, state = "confirmed", evidence = "linux.rpmhpd.enable_corner" }
cx_vote_states = { value = ["active", "wake", "sleep"], state = "confirmed", evidence = "linux.rpmhpd.aggregate_corner" }
mss_vote_states = { value = ["active"], state = "confirmed", evidence = "linux.rpmhpd.aggregate_corner" }
performance_state = { value = "int_max", state = "confirmed", evidence = "linux.qcom_q6v5_pas.sm8550_mpss" }
state_synced = { value = "irrelevant", state = "confirmed", evidence = "linux.rpmhpd.aggregate_corner" }
on_the_wire = { value = ["active"], state = "confirmed", evidence = "linux.rpmh.write_only_active" }

# The AOP message that releases the modem once its images are in place.
[qmp]
load_state_message = { value = "{class: image, res: load_state, name: modem, val: on}", state = "confirmed", evidence = "linux.qcom_q6v5_pas.sm8550_mpss" }
base = { value = 0xc300000, state = "inferred", evidence = "sheng.sm8550" }
size = { value = 0x400, state = "inferred", evidence = "sheng.sm8550" }

# The RSC window and the TCS the modem's vote goes out on.
[rsc]
base = { value = 0x17a20000, state = "confirmed", evidence = "caf.fuxi_live_dts.apps_rsc_drv2" }
size = { value = 0x10000, state = "confirmed", evidence = "caf.fuxi_live_dts.apps_rsc_drv2" }
tcs_offset = { value = 0xd00, state = "confirmed", evidence = "caf.fuxi_live_dts.apps_rsc_drv2" }
spi = { value = 5, state = "confirmed", evidence = "caf.fuxi_live_dts.apps_rsc" }
tcs_stride = { value = 672, state = "confirmed", evidence = "linux.rpmh_rsc.tcs_offset" }
active_tcs_count = { value = 3, state = "confirmed", evidence = "caf.fuxi_live_dts.apps_rsc_tcs_config" }
# The DRV2 id register reads zero on this board, so the layout cannot be taken from it. SM8550's
# RSC is the major-3 layout and the ADSP's forced choice completed its vote on the device.
major_version = { value = 3, state = "confirmed", evidence = "device.adsp.rsc_forced_v3" }
drv_id_zero = { value = true, state = "confirmed", evidence = "device.adsp.rsc_forced_v3" }

# The resources the ADSP's bring-up and the modem's bring-up both need. The interrupt lines are
# attached once per boot and cannot be released, and the RSC's TCS is a single request slot, so
# two owners on the same line or the same TCS corrupt each other. Both remoteprocs name the same
# AOSS mailbox and the same IPCC node in the device tree, which is why these are shared and not
# merely adjacent.
[shared]
ipcc_node = { value = "qcom,ipcc@408000", state = "confirmed", evidence = "caf.fuxi_live_dts.ipcc" }
ipcc_spi = { value = 229, state = "confirmed", evidence = "caf.fuxi_live_dts.ipcc" }
aoss_node = { value = "power-controller@c300000", state = "confirmed", evidence = "caf.fuxi_live_dts.aoss_qmp" }
aoss_phandle = { value = 0x43, state = "confirmed", evidence = "caf.fuxi_live_dts.modem_remoteproc" }
aoss_phandle_adsp = { value = 0x43, state = "confirmed", evidence = "caf.fuxi_live_dts.adsp_remoteproc" }
ipcc_phandle = { value = 0x44, state = "confirmed", evidence = "caf.fuxi_live_dts.modem_remoteproc" }
ipcc_phandle_adsp = { value = 0x44, state = "confirmed", evidence = "caf.fuxi_live_dts.adsp_remoteproc" }
adsp_ipcc_client = { value = 3, state = "confirmed", evidence = "linux.qcom_ipcc" }

# The QRTR node the AP claims. Linux leaves the node id to the endpoint registration, but its
# local node id is 1 and the reference port uses the same.
[qrtr]
local_node = { value = 1, state = "confirmed", evidence = "linux.qrtr.af_qrtr" }
control_port = { value = 0xfffffffe, state = "confirmed", evidence = "linux.qrtr.af_qrtr" }
broadcast_node = { value = 0xffffffff, state = "confirmed", evidence = "linux.qrtr.af_qrtr" }
proto_version = { value = 1, state = "confirmed", evidence = "linux.qrtr.af_qrtr" }
header_bytes = { value = 32, state = "confirmed", evidence = "linux.qrtr.af_qrtr" }

# The modem's own registers, where the remoteproc keeps its state.
[remoteproc]
base = { value = 0x04080000, state = "confirmed", evidence = "caf.fuxi_live_dts.modem_remoteproc" }
size = { value = 0x10000, state = "confirmed", evidence = "caf.fuxi_live_dts.modem_remoteproc" }

# Where the modem's firmware is on this board. The partition is a FAT volume read in place through
# the UFS driver, read only, and the images live in its /image directory under the two names the
# secure world asks for. The list was taken on the device by the fuxi-modem=1 probe.
[firmware]
partition = { value = "modem_a", state = "confirmed", evidence = "device.firmware_partition.modem_images" }
directory = { value = "/image", state = "confirmed", evidence = "device.firmware_partition.modem_images" }
image_file = { value = "modem.mdt", state = "confirmed", evidence = "device.firmware_partition.modem_images" }
dtb_file = { value = "modem_dtb.mdt", state = "confirmed", evidence = "device.firmware_partition.modem_images" }
segment_prefix = { value = "modem.b", state = "confirmed", evidence = "device.firmware_partition.modem_images" }
segment_count = { value = 29, state = "confirmed", evidence = "device.firmware_partition.modem_images" }
image_size = { value = 6364, state = "confirmed", evidence = "device.firmware_partition.modem_images" }
dtb_size = { value = 4044, state = "confirmed", evidence = "device.firmware_partition.modem_images" }

