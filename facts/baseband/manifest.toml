# The sources the fuxi baseband binding rests on.
#
# Every entry states where the value came from and what that source can and cannot prove. A source
# that describes another board on the same SoC is marked as such: it is a prediction for this
# board, not a measurement of it.

schema_version = 1
board = "fuxi"
soc = "sm8550"
status = "source-confirmed"

[source.linux]
repository = "https://github.com/torvalds/linux"
paths = "drivers/remoteproc/qcom_q6v5_pas.c, drivers/rpmsg/qcom_glink_smem.c, net/qrtr/af_qrtr.c, include/dt-bindings/mailbox/qcom-ipcc.h, arch/arm64/boot/dts/qcom/sm8550.dtsi"
kind = "upstream-first-hand"
limits = "These files state the values for the SoC, not for this board. They prove what the modem's firmware and the secure world implement."

[source.caf]
repository = "the fuxi's own CAF device tree, read from the running device"
path = "/tmp/x13/work/device-info/fuxi-live.dts"
kind = "board-first-hand"
limits = "It states the wiring this board's vendor tree declares. It does not prove runtime state."

[source.sheng]
repository = "UniXNU-sm8550-common"
kind = "same-soc-inference"
limits = "The Sheng board's values for the same SoC. A prediction for this board, not a measurement of it."

[source.device_firmware_partition]
repository = "this fuxi, read on the device"
path = "the modem_b partition's FAT volume, listed read-only by the kernel's fuxi-modem=1 probe; the run's log is evidence/2026-11-19-modem-firmware-inventory.log"
kind = "board-first-hand"
limits = "It proves which files the board carries and how large each one is. It says nothing about whether the secure world accepts them, and it says nothing about the modem's runtime state."

# ---- the Linux sources, one fact each ----

[linux.qcom_q6v5_pas.sm8550_mpss]
path = "drivers/remoteproc/qcom_q6v5_pas.c"
statement = "The sm8550_mpss_resource entry: pas_id 4 for the modem image, dtb_pas_id 0x26 (38), proxy_pd_names {cx, mss}, load_state \"modem\", firmware_name \"modem.mdt\", dtb_firmware_name \"modem_dtb.mdt\", smem_host_id 1, crash_reason_smem 421, minidump_id 3, ssctl_id 0x12, auto_boot false, decrypt_shutdown true. The entry carries no proxy_pd_performance_states."
proves = "The PAS ids the secure world expects, the proxy power domains' names, and the AOP load_state string. The absence of proxy_pd_performance_states is what decides the vote: the modem's domains are enabled, not set to a performance corner."

[linux.qcom_q6v5_pas.start_order]
path = "drivers/remoteproc/qcom_q6v5_pas.c"
statement = "The board matches the qcom,sm8550-mpss-pas compatible, so this driver handles the modem, not the older qcom_q6v5_mss.c path. qcom_pas_load requests the DTB firmware (modem_dtb.mdt) and loads it through qcom_mdt_pas_load; qcom_pas_start then runs qcom_q6v5_prepare, enables the proxy power domains, the xo and aggre2 clocks and the cx regulator, authenticates and resets the DTB (qcom_pas_prepare_and_auth_reset on the dtb_pas_ctx), loads the modem image (qcom_mdt_pas_load on the pas_ctx), authenticates and resets that one too, waits for the start and releases both metadata blobs."
proves = "The order the modem's two images go through: the device tree blob is authenticated and reset before the modem image is loaded, each image is loaded before it is reset, and the metadata is released only after the authentication. It is the order the port's stepPas follows."

[linux.qcom_q6v5_pas.memory_assignment]
path = "drivers/remoteproc/qcom_q6v5_pas.c"
statement = "The sm8550_mpss_resource entry carries region_assign_idx 2, region_assign_count 1 and region_assign_vmid QCOM_SCM_VMID_MSS_MSA (0xF), and the entry has no region_assign_shared, so qcom_pas_assign_memory_region asks for the reserved-memory region at index 2 and hands it to that one vmid with QCOM_SCM_PERM_RW. It runs in the probe, after qcom_pas_alloc_memory_region and before qcom_pas_init_clock, so before any PAS call. The ADSP's entry carries no region_assign_idx, so this step belongs to the modem alone."
proves = "That the modem has an upstream memory-ownership step the port does not have: the board's third reserved-memory region, the DSM region mpss_dsm_mem at 0xd4d00000 of 0x3300000 bytes, is handed to the modem's MSA vmid before the modem is started. The ADSP's path, which the port has proven accepted, has no such step."

[linux.qcom_scm.assign_mem_call]
path = "drivers/firmware/qcom/qcom_scm.c"
statement = "qcom_scm_assign_mem builds its argument block in the SCM's secure memory pool (qcom_tzmem_alloc of the tzmem pool, which is backed by the TrustZone memory allocator and, on the platforms that support it, by an SHM bridge), fills it with the source vmid list, a qcom_scm_mem_map_info (the region's address and size) and a qcom_scm_current_perm_info per new owner, and then makes the call with the service QCOM_SCM_SVC_MP (0x0c) and the command QCOM_SCM_MP_ASSIGN (0x16) and seven arguments. Every PAS call in the same file is wrapped in qcom_scm_clk_enable and qcom_scm_bw_enable, the SCM's core and interface clocks and its bus bandwidth."
proves = "That the memory assignment cannot be made with a plain buffer: its argument block has to live in memory the secure world can read, the same way the PAS metadata does. And that every PAS call upstream is bracketed by the SCM's own clock and bandwidth votes, which the port does not make."

[linux.qcom_scm.metadata_allocation]
path = "drivers/firmware/qcom/qcom_scm.c"
statement = "qcom_scm_pas_init_image takes the metadata as a plain buffer and, when the context does not use the TrustZone memory pool, allocates its own copy with dma_alloc_coherent(dev, size, &mdata_phys, GFP_KERNEL), copies the metadata into it and hands mdata_phys to the call. The comment above that allocation says the buffer must be physically contiguous, 4K aligned and non-cachable to avoid XPU violations, because the scm call turns memory protection on over the metadata blob for the duration of the call. The address is carried in desc.args[1], whose type is u64, so the ABI is a full 64-bit value and not a 32-bit one. The context's use_tzmem flag selects a different allocator (qcom_tzmem_alloc of the TrustZone pool), and it is only set when the descriptor says needs_tzmem or the remoteproc has an iommus property."
proves = "Which allocation mechanism upstream uses for the metadata: dma_alloc_coherent, the coherent DMA API, not CMA and not reserved-memory. The reserved-memory regions are the firmware's own carveouts, allocated by of_reserved_mem_region_to_resource in qcom_pas_alloc_memory_region, and they hold the segments rather than the metadata. It also proves that the address travels as a 64-bit value, so a width constraint would come from the allocation rather than from the call's encoding."

[linux.platform.default_dma_mask]
path = "drivers/base/platform.c"
statement = "setup_pdev_dma_masks, called for every platform device from platform_device_alloc and platform_device_register, sets dev.coherent_dma_mask to DMA_BIT_MASK(32) and, when dev.dma_mask is not set, points it at a platform_dma_mask of DMA_BIT_MASK(32). It does this only when the masks are not already set. In drivers/of/device.c of_dma_configure_id then reads the dma-ranges of the device's bus: the soc node in arch/arm64/boot/dts/qcom/sm8550.dtsi declares dma-ranges = <0 0 0 0 0x10 0>, so the bus limit is the whole 64-bit address space, and the driver-set masks are left at 32 bits. qcom_scm_probe sets no dma mask of its own: the file contains no dma_set_mask call."
proves = "That upstream's SCM platform device carries a 32-bit coherent DMA mask and a 32-bit dma mask by default, so upstream's dma_alloc_coherent of the 4044 byte metadata returns a buffer below 4 GiB or fails outright. This is the mask that would have to be widened for a >4 GiB metadata buffer to be legal."

[linux.qcom_q6v5_pas.no_iommu_on_mpss]
path = "arch/arm64/boot/dts/qcom/sm8550.dtsi"
statement = "The remoteproc_mpss node declares memory-region = <&mpss_mem>, <&q6_mpss_dtb_mem>, <&mpss_dsm_mem> and no iommus property. rproc->has_iommu is set from of_property_present(pdev->dev.of_node, \"iommus\"), so it is false for the modem. sm8550_mpss_resource does not set needs_tzmem, so pas->pas_ctx->use_tzmem and pas->dtb_pas_ctx->use_tzmem are both false."
proves = "That on this SoC the modem's metadata goes through dma_alloc_coherent and not through the TrustZone memory pool, and that no IOMMU stands between the AP and the modem's memory. It is the modem-only step that the port does not have: the ADSP's sm8550_adsp_resource carries no region_assign_idx, so the memory-ownership step before any PAS call belongs to the modem alone."

[linux.mdt_loader.metadata_source]
path = "drivers/soc/qcom/mdt_loader.c"
statement = "qcom_mdt_read_metadata copies the ELF header out of the firmware it is given (ehdr_size = phdrs[0].p_filesz) and then copies the hash segment from it: when ehdr_size + hash_size == fw->size the hash is taken from fw->data + ehdr_size (the packed branch, the comment reads \"Firmware is split and hash is packed following the ELF header\"), and when phdrs[hash_segment].p_offset + hash_size <= fw->size it is taken from the hash segment's own offset, and otherwise it is loaded from the split segment file by mdt_load_split_segment. The firmware it is given is the .mdt file: qcom_mdt_pas_load is called with the .mdt, and the .bNN pieces are loaded separately by qcom_mdt_load_no_init."
proves = "That the metadata the secure world authenticates is the .mdt file's own bytes, the header part followed by the hash segment as they sit in that file, and not the hash at its p_offset inside the joined image of the .bNN pieces. It also shows the hash segment of the split segments is loaded from the .bNN piece, so both files are needed and the two must not be mixed."

[linux.rpmhpd.enable_corner]
path = "drivers/pmdomain/qcom/rpmhpd.c"
statement = "rpmhpd_update_level_mapping reads the command database's aux data as the level list and skips the Retention level (16) when it looks for the enable corner, because most hardware will not function at Retention. The first corner with a non-zero level is the enable corner. The Retention entry keeps its position in the level list, so it still occupies an index; only its level value is ignored. If the aux data is zero padded, the padding is cut off and the level count shrinks."
proves = "What the enable corner is, and that the level list the command database carries is the list of corners a rail can be voted to, indexed by position."

[linux.rpmhpd.set_performance_state]
path = "drivers/pmdomain/qcom/rpmhpd.c"
statement = "rpmhpd_set_performance_state walks the level list for the first entry whose level is at least the requested one. A request above every level lands on the last entry, because the loop ends with i == level_count and the code then steps i back by one. It then stores that index in pd->corner. rpmhpd_power_on votes max(pd->corner, pd->enable_corner), and the enable corner never exceeds the highest corner."
proves = "That the modem's two domains are voted to the highest corner. Linux's qcom_pas_pds_enable asks for INT_MAX because sm8550_mpss_resource carries no proxy_pd_performance_states, and INT_MAX lands on the last level. So the port's vote of the highest index is what Linux does."

[linux.rpmhpd.aggregate_corner]
path = "drivers/pmdomain/qcom/rpmhpd.c"
statement = "rpmhpd_aggregate_corner sends an ACTIVE_ONLY vote for a resource with no peer, and for one with a peer it sends all three: ACTIVE_ONLY, WAKE_ONLY and SLEEP. The cx domain has the peer cx_ao and the mss domain has none. The three states are RPMH_SLEEP_STATE, RPMH_WAKE_ONLY_STATE and RPMH_ACTIVE_ONLY_STATE. When the state has not been synchronised, the corner is the highest one (level_count - 1); once it is, the corner passed in is used, and for the modem's domains that is the same highest corner. The corner sent is the index into the resource's level list."
proves = "Which of the three vote states each of the modem's two domains takes, that the corner on the wire is the level-list index rather than the hardware level, and that the state being synchronised or not makes no difference to the modem's vote."

[linux.rpmh.write_only_active]
path = "drivers/soc/qcom/rpmh.c"
statement = "__rpmh_write sends the request to the controller only when the state is RPMH_ACTIVE_ONLY_STATE. For the other two states it caches the value in the controller's cache: the wake value for both ACTIVE_ONLY and WAKE_ONLY, and the sleep value for SLEEP. The cache is written out by rpmh_flush, which the RSC driver calls when the last processor is about to idle and when a power domain goes down. The state also picks the TCS: ACTIVE_ONLY uses the active TCS, and falls back to the wake TCS if the RSC has no active TCS of its own."
proves = "That at the time the modem is started, with the processor still awake, only the active vote reaches the hardware for the modem's rails. The wake and sleep votes are recorded in the cache and sent later, when the processor suspends."

[linux.rpmh.cmd_db_corner]
path = "drivers/pmdomain/qcom/rpmhpd.c"
statement = "The command database's aux data for a resource is the list of hardware levels (vlvl), in ascending order of ARC corner: 16 Retention, 48 Minimum SVS, 128 SVS, 256 NOM, 384 TURBO, 464 Super Turbo. The corner index is the position in that list."
proves = "That the value voted on the wire is the corner index and not the hardware level, and that the levels the command database lists for a rail are the corners it can be voted to."

[linux.qcom_glink_smem]
path = "drivers/rpmsg/qcom_glink_smem.c"
statement = "SMEM_GLINK_NATIVE_XPRT_DESCRIPTOR 478, FIFO_0 479, FIFO_1 480; the descriptor is exactly 32 bytes and holds the transmit tail, transmit head, receive tail and receive head in that order; the AP allocates the descriptor and FIFO_0, and picks up FIFO_1 when the remote makes it."
proves = "The GLINK item ids, the descriptor's word order, and which side owns which FIFO."

[linux.qrtr.af_qrtr]
path = "net/qrtr/af_qrtr.c"
statement = "struct qrtr_hdr_v1 is 32 bytes, little endian, packed: version, type, src_node, src_port, confirm_rx, size, dst_node, dst_port. QRTR_PROTO_VER_1 is 1. The control port is 0xfffffffe and the broadcast node is 0xffffffff. A DATA packet carries the client's own local port as its source port. The name service ignores a DATA packet that arrives before our own HELLO."
proves = "The QRTR wire format and the node and port semantics."

[linux.qcom_ipcc]
path = "include/dt-bindings/mailbox/qcom-ipcc.h"
statement = "IPCC_CLIENT_AOP 0, IPCC_CLIENT_TZ 1, IPCC_CLIENT_MPSS 2, IPCC_CLIENT_LPASS 3, IPCC_CLIENT_SLPI 4; IPCC_MPROC_SIGNAL_GLINK_QMP 0, IPCC_MPROC_SIGNAL_SMP2P 2. A doorbell's id is client << 16 | signal."
proves = "Which IPCC client the modem's doorbells arrive on."

[linux.sm8550.dtsi.mpss_region]
path = "arch/arm64/boot/dts/qcom/sm8550.dtsi"
statement = "sm8550.dtsi includes qcs8550.dtsi, where mpss_mem (mpss-region@8a800000) is 0x8a800000 of 0x10800000, marked no-map."
proves = "The memory the modem's image is loaded into."

[linux.sm8550.dtsi.mpss_dtb_region]
path = "arch/arm64/boot/dts/qcom/sm8550.dtsi"
statement = "In the same qcs8550.dtsi, q6_mpss_dtb_mem (q6-mpss-dtb-region@9b000000) is 0x9b000000 of 0x80000, marked no-map."
proves = "The memory the modem's own device tree blob is loaded into."

[linux.sm8550.dtsi.smp2p_modem_in]
path = "arch/arm64/boot/dts/qcom/sm8550.dtsi"
statement = "The remoteproc_mpss node's interrupts-extended lists the modem's SMP2P entries in the order wdog, fatal, ready, handover, stop-ack, shutdown-ack, so fatal is bit 0 and ready is bit 1."
proves = "Which SMP2P bit means the modem is up and which means it died."

# ---- the board's own device tree ----

[caf.fuxi_live_dts.modem_remoteproc]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the remoteproc-mss@04080000 node"
statement = "compatible \"qcom,kalama-modem-pas\", reg 0x4080000 of 0x10000, label \"modem\", qcom,qmp 0x43, mboxes 0x44 0x02 0x00; the glink-edge gives qcom,remote-pid 0x01; the interrupts-extended entries are 0x77 0x00, 0x77 0x02, 0x77 0x01, 0x77 0x03 and 0x77 0x07, and the interrupt-names give them wdog, fatal, handover, ready, stop-ack and shutdown-ack in that order. 0x77 is the slave-kernel entry, and the second number is the bit within it: so 0x77 0x00 is fatal and 0x77 0x01 is handover."
proves = "The modem's register block, its remote pid, and the fatal and ready bits, from this board's own tree."

[caf.fuxi_live_dts.smp2p_modem]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the qcom,smp2p-modem node"
statement = "qcom,smem = <0x1b3 0x1ac>. Linux's qcom,smp2p binding reads that pair as {inbound, outbound}."
proves = "Which SMP2P item the AP writes and which it reads: the AP writes 0x1ac and reads 0x1b3."

[caf.fuxi_live_dts.modem_qrtr]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the qcom,modem_qrtr node"
statement = "channel \"IPCRTR\", qcom,intents 0x800 0x05 0x2000 0x03 0x4400 0x02."
proves = "The name of the channel the modem opens for QRTR."

[caf.fuxi_live_dts.apps_rsc]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the apps_rsc@17a00000 node and its drv@2 child"
statement = "apps_rsc@17a00000 has reg \"drv-0\" 0x17a00000, \"drv-1\" 0x17a10000 and \"drv-2\" 0x17a20000, each 0x10000, with interrupts GIC_SPI 3, 4 and 5; drv@2 carries qcom,drv-id 0x02 and qcom,tcs-offset 0xd00, and its channel@0 gives qcom,tcs-config <0x02 0x03 0x00 0x02 0x01 0x02 0x03 0x00 0x04 0x01>."
proves = "The RSC window the modem's vote goes out on, its TCS offset, the interrupt line the RSC raises, and the shape of the TCS configuration. The tcs-config names five types (SLEEP 2, WAKE 2, ACTIVE 3, CONTROL 0, FAST_PATH 1), so the three active TCS are the ones a vote may use."

[caf.fuxi_live_dts.ipcc]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the qcom,ipcc@408000 node"
statement = "reg 0x408000 of 0x1000, interrupts GIC_SPI 229, an interrupt-controller with three cells, phandle 0x44."
proves = "The IPCC block's address, its one interrupt line, and that it is an interrupt controller, so all its clients share one line and one handler."

[caf.fuxi_live_dts.aoss_qmp]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the power-controller@c300000 node"
statement = "compatible \"qcom,kalama-aoss-qmp\", reg 0xc300000 of 0x400, interrupt-parent 0x44, mboxes <0x44 0x00 0x00>, phandle 0x43."
proves = "The AOSS QMP mailbox's address and size, and that it is the one node both remote processors name with qcom,qmp 0x43."

[caf.fuxi_live_dts.adsp_remoteproc]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the remoteproc-adsp@03000000 node"
statement = "compatible \"qcom,kalama-adsp-pas\", qcom,qmp = <0x43>, mboxes = <0x44 0x02 0x00>, and the glink-edge gives qcom,remote-pid 0x02."
proves = "That the ADSP names the same AOSS mailbox (0x43) and the same IPCC node (0x44) the modem names. The two bring-ups therefore contend for one mailbox and one interrupt line, and the ADSP's remote pid of 2 is what keeps its GLINK SMEM items apart from the modem's."

[linux.rpmh_rsc.tcs_offset]
repository = "Linux, drivers/soc/qcom/rpmh-rsc.c"
statement = "A TCS's registers sit at tcs_base + regs[RSC_DRV_TCS_OFFSET] * tcs_id + reg, where tcs_base is the driver's base plus the device tree's qcom,tcs-offset, and RSC_DRV_TCS_OFFSET is 672 in both the version 2_7 and the version 3_0 offset tables."
proves = "The stride between consecutive TCS, and so the address arithmetic the port's QcomRpmh.c reproduces. The version tables differ in CMD_OFFSET (20 against 24) and in where the command and wait registers sit, which is why the wrong major version writes to the wrong registers."

[device.adsp.rsc_forced_v3]
path = "the device run recorded in docs/fuxi-audio-test-results.md, the R-SCM-STRICT-01 round"
statement = "The DRV2 id register reads zero on this board, and the ADSP bring-up therefore forces the major version to 3 rather than let the zero choose the version 2_7 layout. With that forced layout the active TCS 2 vote completed and the run recorded \"forced v3 layout after DRV2 ID read 0; active TCS 2; vote done\"."
proves = "That SM8550's RSC on this board is the major-3 layout, and that a vote on the active TCS completes with it. The touch probe, which does not force the version, wrote its votes and never saw the done bit."

# ---- the same-SoC inferences ----

[sheng.sm8550]
repository = "UniXNU-sm8550-common"
statement = "The SM8550 platform windows the board's own glue already uses: the SMEM window, the IPCC block, the AOSS/QMP block, the RPMh RSC block and its TCS offset, and the command database."
proves = "Nothing about the modem. It is where the shared SoC windows come from, on this board's behalf."

[sheng.gmu_command_db]
repository = "UniXNU-sm8550-common/kits/Sm8550Platform/ShengGmuCommandDb.c"
statement = "The command database copy carries gfx.lvl, mx.lvl, cx.lvl and gmxc.lvl."
proves = "That cx.lvl, one of the modem's two proxy domains, is in a command database. It says nothing about mss.lvl, which the copy does not carry."

[caf.fuxi_live_dts.mss_rail]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the rpmh-regulator-msslvl node"
statement = "The board's own device tree declares rpmh-regulator-msslvl with qcom,resource-name \"mss.lvl\", so the vendor tree has the modem's second proxy rail."
proves = "That mss.lvl is the resource name the modem's remoteproc asks for on this board. It says nothing about whether the board's separate command database copy carries that name, which is what the probe looks up at run time."

# ---- the choices that are ours ----

[device.firmware_partition.modem_images]
path = "the modem_b partition's FAT volume, listed by the fuxi-modem=1 probe on the device"
statement = "The /image directory of the board's own modem partition holds modem.mdt (6364 bytes) and modem_dtb.mdt (4044 bytes), and the split segments modem.b00 through modem.b31 with b14, b21 and b30 absent: b00 1076, b01 6948, b02 811476, b03 19420, b04 16700, b05 11772, b06 34896, b07 118784, b08 3391400, b09 36928, b10 16384, b11 4304784, b12 262144, b13 5210112, b15 3732744, b16 473656, b17 4096000, b18 16917448, b19 15242839, b20 6676488, b22 123136, b23 42639424, b24 42896512, b25 1349297, b26 8928, b27 409600, b28 131072, b29 11272, b31 5288. The whole /image directory holds 448 entries."
proves = "That the board carries the modem's firmware under exactly the two names the PAS sequence looks for, and that the image is a split one whose segments are the device's own files. The gaps at b14, b21 and b30 are the split index's own numbering, not a missing read: the listing walks the directory and reports what is there."

[device.firmware_partition.modem_pr]
path = "the modem_b partition's FAT volume, listed by the fuxi-modem=1 probe on the device"
statement = "/image/modem_pr is a directory holding mcfg and so, two more directories, and no firmware image of its own."
proves = "That the modem's configuration and shared-object directories exist and where they are. It says nothing about their contents, which the probe does not walk."

[device.firmware_partition.other_images]
path = "the modem_b partition's FAT volume, listed by the fuxi-modem=1 probe on the device"
statement = "The same partition carries the board's other remote processors' firmware: adsp.mdt with adsp_dtb.mdt, cdsp.mdt with cdsp_dtb.mdt, and ipa_fws.mdt, plus cpusys_vm.mdt and the per-feature images (cardapp.mdt, faceutils.mdt, fingerpr.mdt, mlipay.mdt, ops.mdt, soter64.mdt, and the rest)."
proves = "That the modem partition is a shared image partition that holds every remote processor's firmware, not the modem's alone. The modem's own files are the ones named modem.mdt and modem_dtb.mdt."

[source.device_cmd_db]
repository = "this fuxi, read on the device"
path = "the board's AOP command database at 0x81c60000, read by the kernel's fuxi-modem=3 probe; the run's log is evidence/2026-11-19-modem-rails.log"
kind = "board-first-hand"
limits = "It proves which rails this board's own copy of the command database carries and at what addresses. It says nothing about what the modem asks for at run time, and reading it votes nothing."

[device.modem.runtime_first_boot]
path = "the device run recorded in evidence/2026-11-19-modem-runtime-first-boot.md"
statement = "The modem's runtime path (fuxi-adsp=1 fuxi-modem=4) reached stage 3, the rails vote, and the vote completed on the forced major-3 RSC layout. The modem's stepIpcc attached the IPCC line 261 and the RSC line 37 without an exclusive-access failure, because the ADSP's runtime was off. The secure world then refused the modem device tree blob's metadata on the first PAS call, INIT_IMAGE, with 0xFFCFFFBB. No segment was written and the SMP2P ready and fatal bits stayed clear."
proves = "That the RSC layout rule and the interrupt-line ownership both hold on this board. It does not prove the modem's PAS ids at run time: the DTB's INIT_IMAGE was refused before any segment was loaded, so PAS id 0x26 and the image carveout are still unproven at run time, and the reason for the refusal is not yet known."

[device.cmd_db.modem_rails]
path = "the board's AOP command database, read by the fuxi-modem=3 probe on the device"
statement = "The command database carries cx.lvl at address 0x30000 with 10 levels, mss.lvl at address 0x30060 with 7 levels, mx.lvl at 0x30010 with 9 levels and gfx.lvl at 0x30050 with 14 levels. gpu.lvl and gmxc.lvl are not in it."
proves = "That both of the modem's proxy power domain rails, cx.lvl and mss.lvl, are in this board's own command database, so both votes of the bring-up have a target. It also corrects the earlier inference from the sheng board, which said mss.lvl was absent."
[device.modem.pas_matrix]
path = "the device run recorded in evidence/2026-11-19-modem-pas-matrix.md"
statement = "The same INIT_IMAGE call was made four ways on the board. The ADSP's blob with the ADSP's pas id 36 was accepted with 0/0. The ADSP's blob with pas id 38, the modem's blob with pas id 38 and the modem's blob with pas id 36 were all refused with 0xFFCFFFBB. The instrument was checked first: the support query answers 0/0 for the ids 36 and 1 and 0xFFCFFFC0 for the ids 0xffff and 0x1234. Every one of the 21 ids the secure world accepts refuses the modem's blob with the same 0xFFCFFFBB, and so does the modem's main image under pas id 4."
proves = "That the port's PAS call is correct: the same code, the same argument descriptor, a 4044 byte metadata buffer and neighbouring addresses accepted the ADSP's blob. The refusal is in the modem's firmware content and not in the call, the argument order, the buffer or the pas id. It does not say why the secure world refuses that firmware; the slot survey that follows says which slot was read and that the two slots hold different firmware."

[device.modem.slot_survey]
path = "the fuxi-modem=12 survey on the device, in evidence/2026-11-19-modem-slot-survey.md"
statement = "The two slots are two distinct partitions on LUN 4: modem_a at first block 5126 and modem_b at first block 283283, 114688 blocks each. Both carry the modem's firmware: each /image directory holds 443 entries, with modem.mdt at 6364 bytes and modem_dtb.mdt at 4044 bytes in both. The two slots' modem_dtb blobs are the same 7992 bytes long and differ in 95 of them, the first at offset 4533, which is inside the hash segment."
proves = "That the slot is not the reason the secure world refuses the modem's blob: both slots carry firmware, and the one the refusal was measured against (modem_b, the reader's first choice) is one of them. It also proves that the two slots hold two different builds of the modem firmware, so one of them may be the one the secure world accepts. It says nothing about which build the baseband actually runs."

[device.modem.slot_pas]
path = "the fuxi-modem=13 run on the device, in evidence/2026-11-19-modem-slot-survey.md"
statement = "Each slot's own modem_dtb blob was read out whole, parsed from those bytes, built into the same metadata the runtime path builds and handed to the secure world with the modem's pas id 38. modem_a's blob (7992 bytes, 3 segments, fixed, hash 2) gave 4044 bytes of metadata at 0x8d0b3f000 and 0xFFCFFFBB; modem_b's blob (7992 bytes, 3 segments, fixed, hash 2) gave 4044 bytes of metadata at 0x8d0b60000 and the same 0xFFCFFFBB."
proves = "That neither of the board's two modem firmware builds is accepted by the secure world, so the slot is not the reason for the refusal. The two builds share the metadata's structure, the program headers, the segment's address 0x9b000000 and the image being fixed rather than relocatable; the ADSP's blob, which is accepted, is relocatable. It does not say which of the shared things is the reason."

[device.modem.pas_accepted_ids]
path = "the fuxi-modem=9 sweep on the device, in evidence/2026-11-19-modem-pas-matrix.md"
statement = "The secure world's support query accepts 21 pas ids in the range 0 to 255: 1, 4, 9, 12, 13, 14, 15, 18, 19, 20, 21, 23, 26, 27, 28, 33, 34, 35, 36, 37 and 38. The query answers 0xFFCFFFC0 for ids it does not accept."
proves = "That the modem's pas ids 4 and 38 are among the ids the secure world knows, and that the query discriminates rather than answering yes to everything. It says nothing about which id belongs to which remote processor."

[linux.qcom_scm.assign_mem_argument_shape]
path = "drivers/firmware/qcom/qcom_scm.c"
statement = "qcom_scm_assign_mem builds its argument block inside the SCM's TrustZone memory pool: it allocates a block of qcom_tzmem_alloc(__scm->mempool, ptr_sz), where ptr_sz is the source owner list rounded to 64 bytes, plus a qcom_scm_mem_map_info (the region's address and size) rounded to 64 bytes, plus one qcom_scm_current_perm_info per new owner rounded to 64 bytes. It copies the current owner bits, the mem_map_info and the per-owner permission entries into that block, and calls __qcom_scm_assign_mem with the service QCOM_SCM_SVC_MP (0x0c), the command QCOM_SCM_MP_ASSIGN (0x16) and seven arguments whose types alternate RO and VAL: the region's physical address and size, the source vmid and its size, the destination vmid and its size, and a zero. The argument block itself is passed by its physical address in the last register."
proves = "That the memory-ownership step cannot be made with an ordinary buffer the way the PAS metadata is: its argument block is a structure that the secure world reads out of TrustZone memory, and upstream puts it in the SCM's secure pool rather than in a plain allocation. It also fixes the exact call shape (seven arguments, the MP service and the 0x16 command), which is the part that can be implemented without the secure pool."

[uefi_fuxi.memory_map]
path = "../uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Library/MemoryMapLib/MemoryMapLib.c"
statement = "The board's memory map has no DRAM below 0x80000000. The lowest AddMem DRAM row is DRAM 0x811d0000 of 0x30000 bytes, and the rows run up through DRAM 0xffe00000 of 0x200000, then two rows above 4 GiB: DRAM 0x880000000 of 0x39D00000 (0x880000000..0x8B9D00000) and DRAM 0x8c0000000 of 0x140000000 (0x8C0000000..0xA00000000). The comment on the two high rows records that both measured units list them as System RAM. The reserved rows inside the low space include mpss_region at 0x8A800000 of 0x10800000 and q6_mpss_dtb_region at 0x9B000000 of 0x80000, and mpss_dsm_region at 0xD4D00000 of 0x3300000. There is free DRAM below 4 GiB: eleven AddMem rows, DRAM 0x811d0000 through DRAM 0xffe00000, of 0x2b70b000 bytes in total (728805376 bytes, 0.68 GB), the largest single one being DRAM 0xe7cb0000 of 0xfe4c000."
proves = "That the metadata addresses measured on this board, 0x8d3a3b000, 0x8d5acf000, 0x8d0b1e000 and 0x8d0b1f000, all lie inside the second high DRAM row and are ordinary RAM, not outside the board's memory. It also proves that the board has 0.68 GB of free DRAM below 4 GiB, so a 32-bit coherent DMA mask is physically satisfiable here; an earlier version of this entry claimed the opposite ('no allocation on this board can land below 4 GiB'), which was wrong: it counted the reserved rows and missed the eleven free AddMem rows. What actually keeps a XNU allocation above 4 GiB is not the board but the allocator, and the entry [xnu.arm64.physical_mask_needs_a_fixed_low_address] records how."

[xnu.arm64.physical_mask_needs_a_fixed_low_address]
path = "refer/xnu/iokit/Kernel/IOBufferMemoryDescriptor.cpp (initWithPhysicalMask, lines 176-330), refer/xnu/iokit/Kernel/IOLib.cpp (IOKernelAllocateWithPhysicalRestrict, lines 719-800), refer/xnu/osfmk/vm/vm_resident.c (vm_page_grablo line 3051, vm_lopage_needed line 163, cpm_allocate line 6917), refer/xnu/osfmk/vm/vm_page.h (VM_PAGE_GET_PHYS_PAGE line 427)"
statement = "XNU's physical-mask API cannot place an allocation below 4 GiB on arm64. IOBufferMemoryDescriptor::initWithPhysicalMask turns a mask into an alignment and a highestMask, and then, when the mapping is done by an IOMMU, zeroes highestMask after deriving mapSpec.numAddressBits; when there is no IOMMU it passes highestMask to IOKernelAllocateWithPhysicalRestrict as maxPhys. IOKernelAllocateWithPhysicalRestrict computes contiguous = (contiguous && adjustedSize > page_size) || (alignment > page_size); for a one-page buffer with a page-aligned mask both halves are false, so contiguous is false and the !contiguous branch runs. There, any maxPhys <= 0xFFFFFFFF is replaced by 0 and the KMA_LOMEM flag is set instead. With maxPhys 0 the call becomes kmem_alloc_contig with max_pnum 0, which is no cap at all, and KMA_LOMEM only picks from vm_lopage_queue_free via vm_page_grablo, which on arm64 is a plain vm_page_grab because vm_lopage_needed is set to TRUE only in osfmk/i386/i386_vm_init.c and stays FALSE on arm64. So a 32-bit mask, the port's 0xfffffffffffff000 mask and the audio path's 0x00000000fffff000 mask all behave identically: no bound. That is why the audio path measured a physical address of 0x8CFF84000 (35.25 GiB) from a 32-bit mask, and why the modem's metadata landed at 0x8d39ab000 (35.4 GiB)."
proves = "That the mask argument cannot be used to place the modem's metadata below 4 GiB, and that the mainline Linux fix the fuxi port needs (CONFIG_ZONE_DMA and CONFIG_ZONE_DMA32, whose only effect is to let dma_alloc_coherent land below 4 GiB) has no XNU equivalent in this API. The only mechanism that does place a buffer at a chosen low address is a fixed low-DRAM mapping: IODeviceMemory::withRange(address, bytes)->map(kIOMapAnywhere), which the audio chain already validated on this board. So if the metadata has to be below 4 GiB, it has to be at a fixed address, and it needs a low window of its own: the audio path's 0xd0000000 of 64 KiB is taken, and the modem's own carveouts (mpss_region 0x8a800000 of 0x10800000, q6_mpss_dtb_region 0x9b000000 of 0x80000, mpss_dsm_region 0xd4d00000 of 0x3300000) are reserved to the firmware."

[device.modem.metadata_address_width]
path = "the fuxi-modem=5 PAS matrix and the fuxi-modem=13 slot PAS, both on the device; evidence/2026-11-19-modem-pas-matrix.md and evidence/2026-11-19-modem-slot-survey.md"
statement = "In the PAS matrix the modem's metadata sat at 0x8d0b1e000 and the ADSP's at the neighbouring 0x8d0b1f000, both above 4 GiB. The ADSP's was accepted with 0/0 under pas id 36; the modem's was refused with 0xFFCFFFBB under pas ids 38 and 36. In the slot run both slots' metadata sat above 4 GiB as well, 0x8d0b3f000 and 0x8d0b60000, and both were refused."
proves = "That the width of the metadata address is not what separates the accepted blob from the refused ones: an accepted metadata buffer above 4 GiB and a refused one at the neighbouring address differ in nothing about their address. The discriminator that follows from these runs is the image content, since the ADSP's blob is relocatable and the modem's is fixed."

[intents]
statement = "The IPCRTR channel's intent size is 4096 and the count is 8. The size follows the modem's own edge; the count is ours: it bounds how much the AP can receive before it drains."
proves = "A design decision, not a measurement. The intent handshake absorbs a smaller grant from the modem."
