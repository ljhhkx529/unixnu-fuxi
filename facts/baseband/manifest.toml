# The sources the fuxi baseband binding rests on.
#
# Every entry states where the value came from and what that source can and cannot prove. A source
# that describes another board on the same SoC is marked as such: it is a prediction for this
# board, not a measurement of it.

schema_version = 1
board = "fuxi"
soc = "sm8550"
status = "source-confirmed"

[source.linux]
repository = "https://github.com/torvalds/linux"
paths = "drivers/remoteproc/qcom_q6v5_pas.c, drivers/rpmsg/qcom_glink_smem.c, net/qrtr/af_qrtr.c, include/dt-bindings/mailbox/qcom-ipcc.h, arch/arm64/boot/dts/qcom/sm8550.dtsi"
kind = "upstream-first-hand"
limits = "These files state the values for the SoC, not for this board. They prove what the modem's firmware and the secure world implement."

[source.caf]
repository = "the fuxi's own CAF device tree, read from the running device"
path = "/tmp/x13/work/device-info/fuxi-live.dts"
kind = "board-first-hand"
limits = "It states the wiring this board's vendor tree declares. It does not prove runtime state."

[source.sheng]
repository = "UniXNU-sm8550-common"
kind = "same-soc-inference"
limits = "The Sheng board's values for the same SoC. A prediction for this board, not a measurement of it."

[source.device_firmware_partition]
repository = "this fuxi, read on the device"
path = "the modem_a partition's FAT volume, listed read-only by the kernel's fuxi-modem=1 probe; the run's log is evidence/2026-11-19-modem-firmware-inventory.log"
kind = "board-first-hand"
limits = "It proves which files the board carries and how large each one is. It says nothing about whether the secure world accepts them, and it says nothing about the modem's runtime state."

# ---- the Linux sources, one fact each ----

[linux.qcom_q6v5_pas.sm8550_mpss]
path = "drivers/remoteproc/qcom_q6v5_pas.c"
statement = "The sm8550_mpss_resource entry: pas_id 4 for the modem image, dtb_pas_id 0x26 (38), proxy_pd_names {cx, mss}, load_state \"modem\", firmware_name \"modem.mdt\", dtb_firmware_name \"modem_dtb.mdt\", smem_host_id 1, crash_reason_smem 421, minidump_id 3, ssctl_id 0x12, auto_boot false, decrypt_shutdown true. The entry carries no proxy_pd_performance_states."
proves = "The PAS ids the secure world expects, the proxy power domains' names, and the AOP load_state string. The absence of proxy_pd_performance_states is what decides the vote: the modem's domains are enabled, not set to a performance corner."

[linux.rpmhpd.enable_corner]
path = "drivers/pmdomain/qcom/rpmhpd.c"
statement = "rpmhpd_update_level_mapping reads the command database's aux data as the level list and skips the Retention level (16) when it looks for the enable corner, because most hardware will not function at Retention. The first corner with a non-zero level is the enable corner. The Retention entry keeps its position in the level list, so it still occupies an index; only its level value is ignored. If the aux data is zero padded, the padding is cut off and the level count shrinks."
proves = "What the enable corner is, and that the level list the command database carries is the list of corners a rail can be voted to, indexed by position."

[linux.rpmhpd.set_performance_state]
path = "drivers/pmdomain/qcom/rpmhpd.c"
statement = "rpmhpd_set_performance_state walks the level list for the first entry whose level is at least the requested one. A request above every level lands on the last entry, because the loop ends with i == level_count and the code then steps i back by one. It then stores that index in pd->corner. rpmhpd_power_on votes max(pd->corner, pd->enable_corner), and the enable corner never exceeds the highest corner."
proves = "That the modem's two domains are voted to the highest corner. Linux's qcom_pas_pds_enable asks for INT_MAX because sm8550_mpss_resource carries no proxy_pd_performance_states, and INT_MAX lands on the last level. So the port's vote of the highest index is what Linux does."

[linux.rpmhpd.aggregate_corner]
path = "drivers/pmdomain/qcom/rpmhpd.c"
statement = "rpmhpd_aggregate_corner sends an ACTIVE_ONLY vote for a resource with no peer, and for one with a peer it sends all three: ACTIVE_ONLY, WAKE_ONLY and SLEEP. The cx domain has the peer cx_ao and the mss domain has none. The three states are RPMH_SLEEP_STATE, RPMH_WAKE_ONLY_STATE and RPMH_ACTIVE_ONLY_STATE. When the state has not been synchronised, the corner is the highest one (level_count - 1); once it is, the corner passed in is used, and for the modem's domains that is the same highest corner. The corner sent is the index into the resource's level list."
proves = "Which of the three vote states each of the modem's two domains takes, that the corner on the wire is the level-list index rather than the hardware level, and that the state being synchronised or not makes no difference to the modem's vote."

[linux.rpmh.write_only_active]
path = "drivers/soc/qcom/rpmh.c"
statement = "__rpmh_write sends the request to the controller only when the state is RPMH_ACTIVE_ONLY_STATE. For the other two states it caches the value in the controller's cache: the wake value for both ACTIVE_ONLY and WAKE_ONLY, and the sleep value for SLEEP. The cache is written out by rpmh_flush, which the RSC driver calls when the last processor is about to idle and when a power domain goes down. The state also picks the TCS: ACTIVE_ONLY uses the active TCS, and falls back to the wake TCS if the RSC has no active TCS of its own."
proves = "That at the time the modem is started, with the processor still awake, only the active vote reaches the hardware for the modem's rails. The wake and sleep votes are recorded in the cache and sent later, when the processor suspends."

[linux.rpmh.cmd_db_corner]
path = "drivers/pmdomain/qcom/rpmhpd.c"
statement = "The command database's aux data for a resource is the list of hardware levels (vlvl), in ascending order of ARC corner: 16 Retention, 48 Minimum SVS, 128 SVS, 256 NOM, 384 TURBO, 464 Super Turbo. The corner index is the position in that list."
proves = "That the value voted on the wire is the corner index and not the hardware level, and that the levels the command database lists for a rail are the corners it can be voted to."

[linux.qcom_glink_smem]
path = "drivers/rpmsg/qcom_glink_smem.c"
statement = "SMEM_GLINK_NATIVE_XPRT_DESCRIPTOR 478, FIFO_0 479, FIFO_1 480; the descriptor is exactly 32 bytes and holds the transmit tail, transmit head, receive tail and receive head in that order; the AP allocates the descriptor and FIFO_0, and picks up FIFO_1 when the remote makes it."
proves = "The GLINK item ids, the descriptor's word order, and which side owns which FIFO."

[linux.qrtr.af_qrtr]
path = "net/qrtr/af_qrtr.c"
statement = "struct qrtr_hdr_v1 is 32 bytes, little endian, packed: version, type, src_node, src_port, confirm_rx, size, dst_node, dst_port. QRTR_PROTO_VER_1 is 1. The control port is 0xfffffffe and the broadcast node is 0xffffffff. A DATA packet carries the client's own local port as its source port. The name service ignores a DATA packet that arrives before our own HELLO."
proves = "The QRTR wire format and the node and port semantics."

[linux.qcom_ipcc]
path = "include/dt-bindings/mailbox/qcom-ipcc.h"
statement = "IPCC_CLIENT_AOP 0, IPCC_CLIENT_TZ 1, IPCC_CLIENT_MPSS 2, IPCC_CLIENT_LPASS 3, IPCC_CLIENT_SLPI 4; IPCC_MPROC_SIGNAL_GLINK_QMP 0, IPCC_MPROC_SIGNAL_SMP2P 2. A doorbell's id is client << 16 | signal."
proves = "Which IPCC client the modem's doorbells arrive on."

[linux.sm8550.dtsi.mpss_region]
path = "arch/arm64/boot/dts/qcom/sm8550.dtsi"
statement = "sm8550.dtsi includes qcs8550.dtsi, where mpss_mem (mpss-region@8a800000) is 0x8a800000 of 0x10800000, marked no-map."
proves = "The memory the modem's image is loaded into."

[linux.sm8550.dtsi.mpss_dtb_region]
path = "arch/arm64/boot/dts/qcom/sm8550.dtsi"
statement = "In the same qcs8550.dtsi, q6_mpss_dtb_mem (q6-mpss-dtb-region@9b000000) is 0x9b000000 of 0x80000, marked no-map."
proves = "The memory the modem's own device tree blob is loaded into."

[linux.sm8550.dtsi.smp2p_modem_in]
path = "arch/arm64/boot/dts/qcom/sm8550.dtsi"
statement = "The remoteproc_mpss node's interrupts-extended lists the modem's SMP2P entries in the order wdog, fatal, ready, handover, stop-ack, shutdown-ack, so fatal is bit 0 and ready is bit 1."
proves = "Which SMP2P bit means the modem is up and which means it died."

# ---- the board's own device tree ----

[caf.fuxi_live_dts.modem_remoteproc]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the remoteproc-mss@04080000 node"
statement = "compatible \"qcom,kalama-modem-pas\", reg 0x4080000 of 0x10000, label \"modem\", qcom,qmp 0x43, mboxes 0x44 0x02 0x00; the glink-edge gives qcom,remote-pid 0x01; the interrupts-extended entries are 0x77 0x00, 0x77 0x02, 0x77 0x01, 0x77 0x03 and 0x77 0x07, and the interrupt-names give them wdog, fatal, handover, ready, stop-ack and shutdown-ack in that order. 0x77 is the slave-kernel entry, and the second number is the bit within it: so 0x77 0x00 is fatal and 0x77 0x01 is handover."
proves = "The modem's register block, its remote pid, and the fatal and ready bits, from this board's own tree."

[caf.fuxi_live_dts.smp2p_modem]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the qcom,smp2p-modem node"
statement = "qcom,smem = <0x1b3 0x1ac>. Linux's qcom,smp2p binding reads that pair as {inbound, outbound}."
proves = "Which SMP2P item the AP writes and which it reads: the AP writes 0x1ac and reads 0x1b3."

[caf.fuxi_live_dts.modem_qrtr]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the qcom,modem_qrtr node"
statement = "channel \"IPCRTR\", qcom,intents 0x800 0x05 0x2000 0x03 0x4400 0x02."
proves = "The name of the channel the modem opens for QRTR."

[caf.fuxi_live_dts.apps_rsc]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the apps_rsc@17a00000 node and its drv@2 child"
statement = "apps_rsc@17a00000 has reg \"drv-0\" 0x17a00000, \"drv-1\" 0x17a10000 and \"drv-2\" 0x17a20000, each 0x10000, with interrupts GIC_SPI 3, 4 and 5; drv@2 carries qcom,drv-id 0x02 and qcom,tcs-offset 0xd00, and its channel@0 gives qcom,tcs-config <0x02 0x03 0x00 0x02 0x01 0x02 0x03 0x00 0x04 0x01>."
proves = "The RSC window the modem's vote goes out on, its TCS offset, the interrupt line the RSC raises, and the shape of the TCS configuration. The tcs-config names five types (SLEEP 2, WAKE 2, ACTIVE 3, CONTROL 0, FAST_PATH 1), so the three active TCS are the ones a vote may use."

[caf.fuxi_live_dts.ipcc]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the qcom,ipcc@408000 node"
statement = "reg 0x408000 of 0x1000, interrupts GIC_SPI 229, an interrupt-controller with three cells, phandle 0x44."
proves = "The IPCC block's address, its one interrupt line, and that it is an interrupt controller, so all its clients share one line and one handler."

[caf.fuxi_live_dts.aoss_qmp]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the power-controller@c300000 node"
statement = "compatible \"qcom,kalama-aoss-qmp\", reg 0xc300000 of 0x400, interrupt-parent 0x44, mboxes <0x44 0x00 0x00>, phandle 0x43."
proves = "The AOSS QMP mailbox's address and size, and that it is the one node both remote processors name with qcom,qmp 0x43."

[caf.fuxi_live_dts.adsp_remoteproc]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the remoteproc-adsp@03000000 node"
statement = "compatible \"qcom,kalama-adsp-pas\", qcom,qmp = <0x43>, mboxes = <0x44 0x02 0x00>, and the glink-edge gives qcom,remote-pid 0x02."
proves = "That the ADSP names the same AOSS mailbox (0x43) and the same IPCC node (0x44) the modem names. The two bring-ups therefore contend for one mailbox and one interrupt line, and the ADSP's remote pid of 2 is what keeps its GLINK SMEM items apart from the modem's."

[linux.rpmh_rsc.tcs_offset]
repository = "Linux, drivers/soc/qcom/rpmh-rsc.c"
statement = "A TCS's registers sit at tcs_base + regs[RSC_DRV_TCS_OFFSET] * tcs_id + reg, where tcs_base is the driver's base plus the device tree's qcom,tcs-offset, and RSC_DRV_TCS_OFFSET is 672 in both the version 2_7 and the version 3_0 offset tables."
proves = "The stride between consecutive TCS, and so the address arithmetic the port's QcomRpmh.c reproduces. The version tables differ in CMD_OFFSET (20 against 24) and in where the command and wait registers sit, which is why the wrong major version writes to the wrong registers."

[device.adsp.rsc_forced_v3]
path = "the device run recorded in docs/fuxi-audio-test-results.md, the R-SCM-STRICT-01 round"
statement = "The DRV2 id register reads zero on this board, and the ADSP bring-up therefore forces the major version to 3 rather than let the zero choose the version 2_7 layout. With that forced layout the active TCS 2 vote completed and the run recorded \"forced v3 layout after DRV2 ID read 0; active TCS 2; vote done\"."
proves = "That SM8550's RSC on this board is the major-3 layout, and that a vote on the active TCS completes with it. The touch probe, which does not force the version, wrote its votes and never saw the done bit."

# ---- the same-SoC inferences ----

[sheng.sm8550]
repository = "UniXNU-sm8550-common"
statement = "The SM8550 platform windows the board's own glue already uses: the SMEM window, the IPCC block, the AOSS/QMP block, the RPMh RSC block and its TCS offset, and the command database."
proves = "Nothing about the modem. It is where the shared SoC windows come from, on this board's behalf."

[sheng.gmu_command_db]
repository = "UniXNU-sm8550-common/kits/Sm8550Platform/ShengGmuCommandDb.c"
statement = "The command database copy carries gfx.lvl, mx.lvl, cx.lvl and gmxc.lvl."
proves = "That cx.lvl, one of the modem's two proxy domains, is in a command database. It says nothing about mss.lvl, which the copy does not carry."

[caf.fuxi_live_dts.mss_rail]
path = "/tmp/x13/work/device-info/fuxi-live.dts, the rpmh-regulator-msslvl node"
statement = "The board's own device tree declares rpmh-regulator-msslvl with qcom,resource-name \"mss.lvl\", so the vendor tree has the modem's second proxy rail."
proves = "That mss.lvl is the resource name the modem's remoteproc asks for on this board. It says nothing about whether the board's separate command database copy carries that name, which is what the probe looks up at run time."

# ---- the choices that are ours ----

[device.firmware_partition.modem_images]
path = "the modem_a partition's FAT volume, listed by the fuxi-modem=1 probe on the device"
statement = "The /image directory of the board's own modem partition holds modem.mdt (6364 bytes) and modem_dtb.mdt (4044 bytes), and the split segments modem.b00 through modem.b31 with b14, b21 and b30 absent: b00 1076, b01 6948, b02 811476, b03 19420, b04 16700, b05 11772, b06 34896, b07 118784, b08 3391400, b09 36928, b10 16384, b11 4304784, b12 262144, b13 5210112, b15 3732744, b16 473656, b17 4096000, b18 16917448, b19 15242839, b20 6676488, b22 123136, b23 42639424, b24 42896512, b25 1349297, b26 8928, b27 409600, b28 131072, b29 11272, b31 5288. The whole /image directory holds 448 entries."
proves = "That the board carries the modem's firmware under exactly the two names the PAS sequence looks for, and that the image is a split one whose segments are the device's own files. The gaps at b14, b21 and b30 are the split index's own numbering, not a missing read: the listing walks the directory and reports what is there."

[device.firmware_partition.modem_pr]
path = "the modem_a partition's FAT volume, listed by the fuxi-modem=1 probe on the device"
statement = "/image/modem_pr is a directory holding mcfg and so, two more directories, and no firmware image of its own."
proves = "That the modem's configuration and shared-object directories exist and where they are. It says nothing about their contents, which the probe does not walk."

[device.firmware_partition.other_images]
path = "the modem_a partition's FAT volume, listed by the fuxi-modem=1 probe on the device"
statement = "The same partition carries the board's other remote processors' firmware: adsp.mdt with adsp_dtb.mdt, cdsp.mdt with cdsp_dtb.mdt, and ipa_fws.mdt, plus cpusys_vm.mdt and the per-feature images (cardapp.mdt, faceutils.mdt, fingerpr.mdt, mlipay.mdt, ops.mdt, soter64.mdt, and the rest)."
proves = "That the modem partition is a shared image partition that holds every remote processor's firmware, not the modem's alone. The modem's own files are the ones named modem.mdt and modem_dtb.mdt."

[source.device_cmd_db]
repository = "this fuxi, read on the device"
path = "the board's AOP command database at 0x81c60000, read by the kernel's fuxi-modem=3 probe; the run's log is evidence/2026-11-19-modem-rails.log"
kind = "board-first-hand"
limits = "It proves which rails this board's own copy of the command database carries and at what addresses. It says nothing about what the modem asks for at run time, and reading it votes nothing."

[device.cmd_db.modem_rails]
path = "the board's AOP command database, read by the fuxi-modem=3 probe on the device"
statement = "The command database carries cx.lvl at address 0x30000 with 10 levels, mss.lvl at address 0x30060 with 7 levels, mx.lvl at 0x30010 with 9 levels and gfx.lvl at 0x30050 with 14 levels. gpu.lvl and gmxc.lvl are not in it."
proves = "That both of the modem's proxy power domain rails, cx.lvl and mss.lvl, are in this board's own command database, so both votes of the bring-up have a target. It also corrects the earlier inference from the sheng board, which said mss.lvl was absent."
[intents]
statement = "The IPCRTR channel's intent size is 4096 and the count is 8. The size follows the modem's own edge; the count is ours: it bounds how much the AP can receive before it drains."
proves = "A design decision, not a measurement. The intent handshake absorbs a smaller grant from the modem."
