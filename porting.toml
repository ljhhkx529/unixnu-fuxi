schema_version = 1

[device]
name = "fuxi"
soc = "SM8550"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi 13 (fuxi). Board files from the UniXNU device template, the FTM5 touch driver and its staged kernel probe. No device boot evidence yet."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", ".gitattributes", "local.toml.example", "LICENSE"]
inputs = ["UniXNU examples/device template (SM8550, iPadOS 17.7.11 profile).", "UniXNU-sm8550-common at 23b2049fcd9e30356161def84231334fb55ecca9."]
configuration = ["board.toml: name fuxi, kit fuxi, soc_source sm8550, os_profile ipados-17.7.11-21H461, device_tree.source device:dts/fuxi.dts.", "configs/fuxi_defconfig: the template options, CONFIG_XNU_NATIVE_ADRENO off (the SoC fragment turns it on), and CONFIG_XNU_EXTRA_LD_ARCHIVES for the touch archive. The arch fragment sets CONFIG_XNU_BUILD_ARCHIVES, CONFIG_XNU_NATIVE_AES, CONFIG_XNU_NATIVE_ARCH_TIMER and CONFIG_XNU_NATIVE_PAN; the OS fragment sets CONFIG_XNU_SOURCE_MOCKFS.", "[kernel] archives in build order: corecrypto (plain and namespaced), ArmDTPlatform, ArmCpu, SoftwareAES and its bindings, libpthread, the mockfs fixture, build-fuxi-touch.py."]
procedure = ["./unixnu defconfig fuxi_defconfig -D ../unixnu-fuxi", "./unixnu status --json", "./unixnu build kernel"]
findings = ["The merged configuration is the arch, SoC and OS fragments followed by the defconfig; the archive list has to cover every archive the merged options require, not only those of the template defconfig.", "CONFIG_XNU_SOURCE_MOCKFS (OS fragment) makes vfs_conf.o reference mockfs, so the link needs build/mockfs-fixture/libmockfs_fixture.a: the first CI kernel build at 450f518 applied all 62 patches and built every listed archive, then stopped at that missing archive.", "ArmCpu needs the source corecrypto provider, so corecrypto is built before the components, as in UniXNU-sheng."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["unixnu.lock is not committed yet."]
next_action = ["Run ./unixnu fetch and commit unixnu.lock."]
evidence = [
  { kind = "source", reference = "board.toml", result = "Board selection and archive order" },
]

[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["proprietary-files.txt"]
inputs = ["A fuxi UEFI port that starts DarwinBoot: hanzi123-bilp/uefi-fuxi, Sohytrs/uefi-fuxi (fuxi branch) or mouse233/uefi-fuxi.", "fastboot boot of the image (temporary, nothing is written to the device)."]
configuration = ["board.toml [firmware]: config fuxi, dsc Platforms/Xiaomi/fuxiPkg/fuxi.dsc, as the community UEFI ports use; not built here yet."]
procedure = ["Select and pin a uefi-fuxi revision, then ./unixnu build firmware --uefi ../uefi-fuxi."]
findings = ["The stock device tree already has /reserved-memory/splash_region at 0xb8000000 (0x2b00000), so no bootimg dtb_node is added."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["No firmware revision is selected and no firmware build has run."]
next_action = ["Pin one uefi-fuxi revision and build it."]
evidence = []

