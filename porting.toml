[[area]]
id = "input"
status = "implemented"
components = ["QcomGeniSpi", "FuxiFtsTouch"]
paths = ["drivers/FuxiFtsTouch", "drivers/FuxiFtsTouch/**", "include/FuxiTouch*", "package/*Touch*", "scripts/*touch*", "facts/touch_*", "tests/**", "package/*Hid*", "scripts/*hid*"]
inputs = ["Stock device tree (OS3.0.309 vendor_boot DTB[2] with dtbo[4], merged with fdtoverlay): /soc/qcom,qupv3_1_geni_se@ac0000/spi@a90000/fts@0, compatible st,spi, 12 MHz, SPI mode 0.", "Controller ST FingerTip FTM5, chip id 36 40, firmware 53.42 kept in its own flash (/proc/tp_fw_version on Android), tp-vendor 0x38.", "Bus QUP1 SE4 at 0xa90000, wrapper 0xac0000, SMMU stream 0xa3; pins 44-47 (qup1_se4); interrupt GPIO 25 (active low, TLMM summary SPI 208); reset GPIO 24.", "Rails vdd ldob12 1.8 V (RPMh 0x40900) and avdd ldom6 3.2 V (RPMh 0x41b00), measured with root on Android; their only consumer is spi0.0."]
configuration = ["board.toml [components] selects QcomGeniSpi and FuxiFtsTouch; [kernel] archives runs scripts/build-fuxi-touch.py.", "configs/fuxi_defconfig links build/fuxi-touch/libFuxiTouch.a through CONFIG_XNU_EXTRA_LD_ARCHIVES; patches/xnu/fuxi-touch-probe.patch calls native_touch_probe() from bsd_init after IOKitInitializeTime().", "Boot arguments: fuxi-touch=1..4, fuxi-touch-panic=1 or 2, fuxi-touch-hid=1, fuxi-touch-hz, fuxi-touch-power, fuxi-touch-tcs, fuxi-touch-poll, fuxi-touch-map. board.toml sets fuxi-touch=4 fuxi-touch-hid=1 fuxi-touch-panic=2.", "The HID digitizer: package/NativeHidInput.cpp, an unchanged copy of UniXNU ShengHidInput 71a40e7, built by scripts/build-fuxi-hid-input.py with the kernelcache addresses of scripts/fuxi_hid_abi.py and force-loaded by fuxi_defconfig. package/FuxiHidProbe.cpp, in the touch archive, loads IOHIDFamily and IOHIDEventDriver, waits for IOHIDResource, registers NativeHidInput's metaclass and starts the touch-only device; the touch probe calls it once sensing runs."]
procedure = ["Stage 1: snapshot of the QUP clocks, the pins and the two rails in the command database.", "Stage 2: RPMh votes vdd then avdd in active TCS 2 of apps RSC DRV2 (tcs-offset 0xd00), wait 3 ms, vote the QUP clocks, configure the pins.", "Stage 3: GENI SPI at 12 MHz; reset low 10 ms; wait for event 03 (2 ms polls, 100 ms, three tries, then the ICR 4-wire fallback and the chip id); read the chip id.", "Stage 4: A0 00 00, 50 ms, A0 00 01; falling-edge interrupt; drain the FIFO; publish contacts in the ShengHidInput ABI.", "Host: run the FuxiFtsTouch tests and tests/board_test.c (README)."]
findings = ["The fts_spi driver dispatches events on the high nibble of byte 0, whose bits 2-3 carry the top of the major axis, so 0x13 to 0x1F are all enter events.", "Coordinates are ten times the panel pixels (fts,support-super-resolution): 0..10800 x 0..24000; the probe maps them to the 30480 x 20320 range that ShengHidInput scales from.", "Both touch rails stay on while Android runs, also with the screen off, and carry no boot-on property, so the probe votes them before it touches the controller.", "Stage 3 on the device (e901139, evidence/2026-11-02-first-boot.md): the command database gives ldob12 0x40900 and ldom6 0x41b00, the RPMh request in TCS 2 returns 0 (done bit not seen within 10 ms), the QUP branches run, pins 44-47 read 0x85 0x85 0x85 0x87 (function 1, 6 mA, CS pulled up), the reset pin is driven high, GENI is QUP 3.9 at exactly 12 MHz, the controller answers the first reset with CONTROLLER_READY (03 00 00) and reads chip id 36 40, and no SPI transfer failed.", "Stage 4 in polling mode on the device (484a650, image p3-poll, fuxi-touch-poll=1): sensing starts (status 0), 3531 FIFO reads bring 12 events, one tap gives 1 enter, 8 moves and 1 leave, with no error event, no re-arm and no failed transfer. The last position is 2885,18595 in the raw range 0..10800 x 0..24000 (pixel 288,1859). The owner was asked to tap the lower left: y is above the short-axis range, so the axes are not swapped, and small x with large y means neither is mirrored; the two interrupt-mode taps read there too (not a calibration).", "Stage 4 with the interrupt armed works on the device (484a650): image t4c-diag (with armcpu-diagnostics=1) reads in1 mv9 up1 at 1295,16685 with irq11/0 and rd12, and the second run of t4b-touch reads in1 mv8 up1 at 1635,19935 with irq10/0 and rd11: one interrupt per touch event, none spurious, against 3531 FIFO reads in polling mode. The path is sheng's except for the edge (fuxi falling, sheng rising).", "Two contacts on the device (484a650, third run of t4b-touch): pressing with two fingers and lifting one reads in2 mv539 up1 c1, with the remaining contact at 3095,15215, irq290/0 and rd291: an interrupt brings about two events, because the probe drains the FIFO in one read.", "Unexplained reset: the first run of t4b-touch reset the phone by itself within seconds of the kernel starting (the owner saw the bands, then a restart; Android up 65 s after the boot command, no panic screen). The same bytes ran to the touch report twice afterwards, one of those started from running Android through adb reboot bootloader, and armcpu-diagnostics=1 reported nothing in t4c-diag. So it is intermittent, one of eight boots with the bridge and the interrupt armed, and the cause is unknown. That first run is the only one that entered fastboot by hand after Android: one sample, not a cause.", "On a boot with sheng-smp=1 the touch interrupt stays on the boot CPU (armcpu_spi_attach routes an SPI to the boot affinity) while the probe's thread may run on any core, so its wakeup can cross cores through an IPI. The report then ends with two SMP rows after the four FTS rows (see cpu and diagnostics).", "With all eight cores running (s1-smp, s2-smp, s3-selfipi) the touch path works unchanged: irq43/0, irq86/0 and irq8/0, no spurious interrupt, no error event and no failed transfer, while the interrupt stays routed to core 0 and the probe's thread ran on core 3 or 4.", "The RPMh votes are needed (680a818, image p4-power0, fastboot entered by hand from a panic screen): with fuxi-touch-power=0 only the two rail votes are skipped, and the controller never answers. No ready event after three resets and the 4-wire fallback (FTS_ERR_CHIP), chip id 00 00, while no transfer failed; with the votes every boot reads 36 40.", "ShengHidInput is not selected as a catalog component: that would pull in its catalog dependency ShengNovatekTouch, and UniXNU's build-sheng-hid-input.py reads a prelinked reference candidate that only an earlier sheng build leaves. fuxi builds the unchanged source with its own script, as it does the PMGR bridge. IOHIDFamily sits at the same addresses in the fuxi kernel as in UniXNU's reference: the pinned constructor, handleStart and handleReport instructions match, getMetaClass returns the bound metaclass, and IOHIDDevice overrides the same 18 IOService slots, with its 56 own slots in the kext."]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = ["One boot of stage 4 reset the phone for an unknown reason (see findings). Unverified: whether the done bit latches without the TCS interrupt, stable contact IDs over longer gestures, and the HID orientation on a portrait panel. The HID layer is linked but not yet seen on the device.", "GENI has no setting for the 10 us chip-select hold the vendor driver uses (SPI_DELAY_CS)."]
next_action = ["Boot an image with fuxi-touch-hid=1 and read the HID row: the device should start, an event driver attach, and the hid counter rise with each touch. If a reset happens again, record how the phone reached fastboot and what ran before it."]
evidence = [
