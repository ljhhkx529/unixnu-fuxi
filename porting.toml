  { kind = "device", command = "fastboot boot of image m1-touch (SHA-256 be38300f17d03ca1): uefi-fuxi c5793bc2, fuxi-touch=4 fuxi-touch-panic=2", revision = "740711055534bd48f056f25d7bbc2673b1f57044", reference = "evidence/2026-11-02-first-boot.md", result = "Two fingers, one lifted: in2 mv221 up1 c1 at 3575,13965, irq113/0, rd114, no error, no failed transfer; no reset" },
