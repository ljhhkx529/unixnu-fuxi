  { kind = "device", command = "fastboot boot of image s2-smp (SHA-256 6ca28d294bb2b318): sheng-smp=1 armcpu-spi-ipi=1 armcpu-diagnostics=1 fuxi-touch=4 fuxi-touch-panic=2", revision = "680a818ff5efbd920d03dbedd87963d5c6116fbc", reference = "evidence/2026-11-02-first-boot.md", result = "Two fingers, one lifted, all cores running: in2 mv167 up1 c1 at 7495,11165, irq86/0, rd87, no error; the probe reported from core 3" },
