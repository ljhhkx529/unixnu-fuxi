[[area]]
id = "network"
status = "planned"
components = ["QcomBaseband"]
paths = ["package/*Wifi*", "package/MhiBoot*", "scripts/*wifi*", "scripts/*mhi*", "package/QcomScm.*", "package/QcomGlink.*", "package/QcomSmem.*", "package/QcomSmp2p.*", "package/QcomMdt.*", "package/QcomQmp.*", "package/QcomRpmh.*", "package/FuxiAdspFirmware.*", "docs/fuxi-baseband-plan.md", "docs/baseband-porting-plan.md", "facts/baseband/**", "package/FuxiModem*", "package/FuxiModemPas.h", "package/FuxiModemScm.h", "package/FuxiRscLayout.h", "package/tests/fuxi_rsc_layout_host.c", "patches/xnu/fuxi-modem-probe.patch", "scripts/check-fuxi-modem-*", "scripts/check-fuxi-rsc-layout-host.py", "evidence/2026-11-19-modem-runtime-first-boot.md", "evidence/2026-11-19-modem-pas-matrix.md", "evidence/2026-11-19-modem-slot-survey.md", "evidence/2026-11-20-modem-region-assign.md", "evidence/2026-11-20-modem-low-metadata.md", "evidence/2026-11-20-modem-up.md", "evidence/2026-11-20-modem-link-up.md", "evidence/2026-11-20-modem-name-service.md", "evidence/2026-11-21-modem-service-lookup.md", "evidence/2026-11-21-modem-registry-table.md", "package/FuxiModemLowMeta.h", "package/tests/fuxi_glink_open_host.c", "scripts/check-fuxi-glink-open-host.py", "package/tests/fuxi_modem_low_meta_host.c", "scripts/check-fuxi-modem-low-meta-host.py", ".claude/hooks/porting_rules.py", "package/FuxiModemAssign.h", "package/tests/fuxi_modem_assign_host.c", "scripts/check-fuxi-modem-assign-host.py", "scripts/live-fuxi-modem-state.py", "UniXNU/drivers/QcomBaseband/**"]
inputs = ["The Wi-Fi chip of the board, from the stock device tree.", "The fuxi Qualcomm MPSS modem: the CAF running device tree (/soc/remoteproc-mss@04080000, qcom,ipa@3e00000, qcom,smp2p-modem, the GLINK IPCRTR and DS channels) and the UEFI stock DTB sm8550-xiaomi-fuxi.dtb."]
configuration = ["No network component is selected.", "The baseband design inputs are in docs/fuxi-baseband-plan.md: eleven difficult items (D1 upstream merge, D2 IPA v5.5, D3 board adapter rewrite, D4 QRTR/IPCC/rmtfs, D5 SCM glue, D6 low DRAM, D7 SMEM item 497, D8 SIM and RF facts, D9 iPadOS integration, D10 build chain, D11 missing fact sources) and stages S0 to S10.", "The QcomBaseband component is selected and its archive is linked: unixnu-fuxi/board.toml names component:QcomBaseband in the kernel archives, and configs/fuxi_defconfig force-loads build/qcom-baseband/libQcomBaseband.a."]
procedure = ["Identify the Wi-Fi chip and its bus.", "S0 merge UniXNU origin/main without the baseband and keep the build green.", "S1 freeze the fuxi baseband facts into facts/baseband/.", "S2 add the upstream QcomBaseband component without the board adapter.", "S3 write the fuxi board adapter and regenerate the IPA v5.5 tables.", "S4 start the MPSS over PAS and keep RF off.", "S5 open the GLINK IPCRTR and DS channels and bring up QRTR.", "S6 bring up the read-only QMI control plane.", "S7 read SIM slot 1 and collect its signal metrics, RF still controlled."]
findings = [ "The modem's published service list is exactly two entries: SERVREG_NOTIF (0x42) and SSCTL (0x2b). Neither can lead to UIM, and the one service that could - the locator, 0x40 - was asked for in upstream's own form and was not answered.", "The modem's name service answers nothing. Over the 15351 seconds of run-20261121-113715 the port sent 84 service lookups in all - the counter reads 'the service lookups sent 84' and stops moving at t=69 s - and the modem answered 2 of them; the figure '3042' an earlier version of this finding quoted was a timestamp in the log, not a counter. The two NEW_SERVERs the modem sent came after every lookup had already gone out, so they are its own announcement and not an answer. Upstream Linux's name service refuses a lookup that does not come from the node it bound to (ctrl_cmd_new_lookup: `if (from->sq_node != qrtr_ns.local_node) return -EINVAL;`), and the modem runs that same code.", "Service 0x42 is SERVREG_NOTIF, a state notifier for one named service path, and it has no list message: its whole set is register-listener (0x0020), query-state (0x0021), state-updated (0x0022) and restart-protection-domain (0x0024). The last of those is a hazard of the same kind as SSCTL's restart and is never sent. The service that does list is SERVREG_LOC, 0x40, whose GET_DOMAIN_LIST message answers with the domain list; upstream's protection-domain mapper registers for it by name with version 1 and instance 1.", "The modem's own SMP2P holds two entries and no more: 'smp2p' (0x0) and 'slave-kernel' (0x6). The value 0x6 is the ready bit (0x2) and the handover bit (0x4). There is no entry the port does not know, and in particular none that names a service the modem is waiting for. The AP's own outbound 'master-kernel' entry is created and never written, which is also what Linux does: upstream uses that entry for the stop state (qcom,smem-states = <&smp2p_modem_out 0>) and not for bringing the modem's services up.", "The modem's own service registry table is on the device and has been read: /image/modemr.jsn is 710 bytes and names one protection domain, msm/modem/root_pd with qmi_instance_id 180, and inside it two services, tms/servreg and gps/gps_service, both with service_data_valid 0 and service_data 0. The reference locator (hakios.mpss.c servreg_load) reads exactly this shape and builds one entry per provider/service pair, so the table answers 'tms/servreg at msm/modem/root_pd, instance 180'. The instance 180 is the instance of the services the table maps, not the instance of the locator itself, which the reference publishes as 257. The other six tables (adspr, adsps, adspua, battmgr, cdspr) carry their own domains and have not been read yet, so the full table is their union and not this file alone.", "The metadata the secure world authenticates is taken out of the .mdt file, not out of the joined image of the .bNN pieces. Linux drivers/soc/qcom/mdt_loader.c, qcom_mdt_read_metadata: the ELF header is copied out of the .mdt, and the hash segment is copied from fw->data + ehdr_size when ehdr_size + hash_size == fw->size (the packed branch), which is the .mdt of 4044 bytes for modem_dtb (148 byte header part plus a 3896 byte hash segment) and 6364 for modem.mdt. The port read the metadata out of the joined image instead, where the hash segment sits at the program header's p_offset (4096 for modem_dtb, the .b02 piece). Upstream takes the hash segment of the split segments from the .bNN piece when it loads them (mdt_load_split_segment), so both files are needed and the two must not be mixed. How much this changes the bytes is not established: the .mdt file of a split image is normally the header part followed by the hash segment, which for modem_dtb is exactly b00 followed by b02, so on this board the two sources may well be byte-identical and the change a no-op in the bytes while still being the upstream-correct source. The mode 11 probe now counts the differing bytes between the two forms and the runtime log says which source was used, so the next device run measures it instead of assuming it.", "No fuxi network observation yet.", "The fuxi modem is an integrated Qualcomm MPSS reached over GLINK/QRTR and QMI, not an Apple PCIe baseband: the stock device tree has modem_pas enabled and no baseband node. The upstream QcomBaseband component's protocol direction therefore fits, and its Apple class names are a deliberate facade for an unmodified CommCenter.", "The upstream QcomBaseband component is not in this fork. The fork is 611 commits behind and 161 ahead of origin/main, and a merge-tree dry run reports 98 conflicts: 73 in docs/, 11 other scripts and data files, 6 in scripts/unixnu/, 5 in the repository root (components.toml, .gitmodules, README.md, README.zh-CN.md, devices.toml) and three submodule pointers.", "The device repository already carries the low-level substrate: SMEM by item id, SMP2P, generic GLINK-SMEM, MDT parsing with PAS metadata, and a FAT reader that already mounts the device's own modem_a/modem_b partitions read-only. The missing pieces are the SCM call glue (an equivalent sequence already runs for ADSP in package/FuxiAdspProbe.cpp), QRTR itself, IPCC, the modem PAS sequence and IPA v5.5.", "The IPA register and endpoint tables of the upstream component target SC7180 IPA v4.2, while the fuxi stock device tree reports qcom,ipa-hw-ver = 0x18 and the mainline fuxi kernel uses ipa_data-v5.5.c with the AP_MODEM_RX and MODEM_AP_RX endpoint ids moved from 23 and 21 to 24 and 22. The tables must be regenerated, not transcribed.", "The mainline fuxi kernel records six baseband pitfalls that also apply here: the modem-tables mapping is 0x146a8000 rather than 0x14688000, the INIT_MODEM_DRIVER request needs the hw_filter_stats_info, smem_info and per_stats_smem_info TLVs, SMEM item 497 belongs to the modem so the AP must map the whole SMEM region instead of allocating the item, the GSI modem channels must be halted after the modem goes offline, the QRTR HELLO race must not drop the remote NEW_SERVER announcements, and coherent allocations must come from low DRAM.", "Only the hw_filter_stats_info TLV (0x23) is filled on fuxi. The smem_info (0x24) and per_stats_smem_info (0x25) TLVs are guarded by !ipa->smem_modem_owned, and the fuxi whole-SMEM-map path sets that flag, so those two must stay unset.", "The upstream component needs no rmtfs for firmware: the existing FAT reader over modem_a/modem_b covers it. Whether the modem asks the AP for NV or calibration files at runtime is still open and is a S1 question.", "The card 1 goal was already reached once on this same fuxi under mainline Linux: UIM reports both physical slots ACTIVE, card 1 registered on CHN-UNICOM 460-01 with LTE RSRP -82 dBm and SNR 21.8 dB and later on 5G NR with signal 50. The hardware and modem side therefore have no open question; the work on this side is replacing the Linux userland stack with an in-kernel QMUX/QMI bridge.", "The mainline ModemManager 1.25.95 treats the last ACTIVE slot as the active one, which reprobes forever when both slots are ACTIVE, and its --set-primary-sim-slot is a no-op in that state. The single radio state owner of S7 must not reproduce either behaviour.", "The audio chain already solved the low DRAM problem on the device: a fixed 0xd0000000 64 KiB mapping with kIOMapAnywhere, after a runtime allocation that landed at 0x8CFF84000 and failed. The modem PAS reuse of that path is new work because the modem segments are far larger than 64 KiB.", "The modem PAS ids are confirmed. Linux's drivers/remoteproc/qcom_q6v5_pas.c, the sm8550_mpss_resource entry, states the modem image's pas_id as 4 and the modem device tree blob's dtb_pas_id as 0x26 (38), with proxy_pd_names {cx, mss}, load_state modem and the firmware names modem.mdt and modem_dtb.mdt. The same source gives the crash-reason SMEM item 421, the minidump item 3 and the ssctl id 0x12.", "The modem's transport is now traced from primary sources. Linux reaches it as remoteproc_mpss (sm8550.dtsi: compatible qcom,sm8550-mpss-pas, reg 0x04080000/0x10000) with a glink-edge child carrying qcom,remote-pid = <1>, which drivers/rpmsg/qcom_glink_smem.c maps onto SMEM items 478 (the 32-byte descriptor: transmit tail, transmit head, receive tail, receive head), 479 (FIFO_0) and 480 (FIFO_1). The modem opens the rpmsg channel named IPCRTR, which net/qrtr/smd.c matches, and the QRTR packets travel on it whole.", "XNU has no QRTR at all: no af_qrtr.c, no bsd/soc/. The Trogdor reference port keeps its QRTR transport in bsd/dev/coachz_wifi.c, a file the fuxi tree does not have. The fuxi therefore needs its own QRTR protocol layer, which is what the component's platform/fuxi/qcom_qrtr.c is.", "The QRTR wire format is taken from Linux net/qrtr/af_qrtr.c and include/uapi/linux/qrtr.h: a 32-byte little-endian header (version, type, src_node, src_port, confirm_rx, size, dst_node, dst_port), version 1, the payload padded to four bytes, and the header and payload in one contiguous buffer because skb_push() puts the header in front of the payload the skb already holds.", "The fuxi HELLO race in the mainline patch set is a real hazard for this port: the modem's name service ignores a DATA packet that arrives before our own HELLO went out, so the layer drops such a packet rather than sending it (hello_dropped counter).", "The GLINK, SMEM and SCM plumbing is reused from the device repository (package/QcomGlink.c, package/QcomSmem.c) and only the QRTR framing and the IPCRTR channel binding are new, so no Linux-specific mechanism is copied into XNU.", "The component builds and links into the fuxi kernel: the archive is built from the tree's own compile records, the prelinked kernel carries _fuxi_modem_start, _fuxi_modem_poll, _fuxi_modem_report and the _qrtr_* protocol entry points alongside the AppleBaseband classes.", "The IPA data path (coachz_modem_data_send and coachz_modem_data_receiver) is not implemented for the fuxi and returns ENETDOWN. It is not on the critical path of the card 1 goal: SIM status and signal information ride the QRTR control channel, not the IPA raw-IP path.", "The modem's binding is now frozen in facts/baseband/: binding.toml carries every value a build would use with its state (confirmed, inferred, chosen or unverified) and the source it rests on, and manifest.toml states what each source proves and what it cannot. The PAS ids, the GLINK item ids, the IPCC client, the SMP2P items, the ready and fatal bits and the QRTR framing are confirmed from first-hand sources; the SMEM, IPCC, AOP and RPMh windows are inferred from the shared SM8550 platform.", "The component carried two real defects, both found by driving the real adapter in a host integration test rather than by reading it. The first: the adapter sent its HELLO the moment it started, before the GLINK channel was up, so the packet had nowhere to go and was lost; the HELLO is now owed and sent from the owner's poll once the channel is up. The second: the answer to the modem's own HELLO was a one-shot send, and it was always refused because the remote's receive intent was still held by the very packet that carried its HELLO; the answer is now owed and flushed on the next event. The integration test fails against both old behaviours and passes against the new one.", "The modem's PAS sequence now lives in one place, package/FuxiModemPas.h, and the probe drives it: the device tree blob first, then the modem image; INIT_IMAGE, then MEM_SETUP only for a relocatable image, then AUTH_AND_RESET; and success is x0 == 0 and x1 == 0 with nothing else. The host check scripts/check-fuxi-modem-pas-host.py checks that header directly, and it fails if the order is swapped or the success test is loosened.", "The modem probe is wired into the boot path: patches/xnu/fuxi-modem-probe.patch calls native_fuxi_modem_probe from bsd_init under DEVELOPMENT || DEBUG, and the probe does nothing unless the fuxi-modem boot argument is set. The kernel links with it, and the prelinked kernel.macho carries _native_fuxi_modem_probe, _fuxi_modem_start, _fuxi_modem_poll, _fuxi_modem_report and _qrtr_flush_hello_reply.", "The baseband facts now have a checker of their own, scripts/check-fuxi-baseband-facts.py, the counterpart of the audio one. Writing it found three real defects in the binding, all of which the record checker does not look at: a dangling evidence key (the DTB carveout cited linux.sm8550.dtsi.mpss_dtb_region, which the manifest never defined), an entry with no evidence at all (rails.mss_in_cmd_db), and a wrong statement in the manifest about the modem's interrupts-extended. That last one matters: the CAF tree lists six modem interrupts as wdog, fatal, handover, ready, stop-ack, shutdown-ack, so 0x77 0x00 is fatal and 0x77 0x01 is handover, while the manifest had called 0x77 0x02 fatal and 0x77 0x01 ready. The code was already right (package/FuxiModemProbe.cpp uses Linux's numbering, fatal 0x1 and ready 0x2, because Linux's sm8550.dtsi has no handover and so numbers the rest one lower), but the record of it was wrong and would have led the next person to the wrong bit. The checker verifies every evidence key resolves, that no confirmed value rests on a design decision, and that the board's own device tree still declares the SMP2P pair, the IPCRTR channel, the mss.lvl rail, the remote pid and the interrupt order. It was proved to fail by breaking each of those in turn.", "The modem's runtime path ran on the device for the first time on 2026-11-19 and reached stage 3, the rails vote. That is the first stage that needs the vote to complete, and it completed on the forced major-3 RSC layout: before the fix the probe took the version 2_7 offsets for a DRV2 id register that reads zero, wrote the request to registers that are not the request registers, and the done bit never came. The ADSP's runtime being off is what let the modem through the interrupt lines: the ADSP's bring-up runs first in bsd_init and takes the IPCC line 261 and the RSC line 37, and an interrupt line can be attached only once per boot, so while the ADSP held them the modem's stepIpcc would have failed with kIOReturnExclusiveAccess. The modem was not started: the secure world refused the DTB's metadata on the first PAS call, INIT_IMAGE, with 0xFFCFFFBB. The modem firmware is on the board, and the device says so. The kernel's read-only inventory (fuxi-modem=1) mounts the firmware partition's FAT volume and lists its /image directory: 448 entries, among them modem.mdt (6364 bytes), modem_dtb.mdt (4044 bytes) and the split segments modem.b00 to modem.b31 with b14, b21 and b30 absent, 29 segments in all. The two names the secure world asks for are the two names the board carries, so the PAS sequence's file lookup has nothing left to guess. The partition is a shared image partition: it also holds adsp.mdt, cdsp.mdt, cpusys_vm.mdt, ipa_fws.mdt and the per-feature images, so a lookup of modem.mdt must not be confused with the partition being the modem's alone.", "Which slot the modem's firmware comes from was an assumption until the fuxi-modem=12 survey measured it on the device. The two slots are two distinct partitions and both carry the modem's firmware, and they are different builds: their modem_dtb blobs differ in 95 bytes inside the hash segment. The fuxi-modem=13 probe then offered each slot's own blob to the secure world and both were refused with the same 0xFFCFFFBB, so the slot is not the reason for the refusal and neither build is accepted. What the two refused blobs share and the accepted ADSP blob does not is that the modem's device tree blob is a fixed image (its segment names 0x9b000000) while the ADSP's is relocatable; that difference is now the first thing left to check, and it is a fact about the board's reserved-memory layout rather than about the modem's code.", "The four address checks are done and they close the address width as a cause. The metadata address is a physical address, taken from getPhysicalSegment(0, nullptr, kIOMemoryMapperNone), which returns the descriptor's physical address and not a virtual one and not an IOMMU DMA address. Upstream allocates the same buffer on the SCM platform device, whose masks default to 32 bits: setup_pdev_dma_masks gives it coherent_dma_mask = DMA_BIT_MASK(32) and a DMA_BIT_MASK(32) dma_mask, and qcom_scm_probe sets neither itself, so upstream's dma_alloc_coherent of the 4044 bytes lands below 4 GiB or fails. The address itself travels as a 64-bit value (desc.args[1] is u64), so the SMC encoding does not truncate it: the width constraint is in the allocation, not in the call. Upstream's mechanism is dma_alloc_coherent, the coherent DMA API; it is not CMA and not reserved-memory, because the reserved-memory regions are the firmware's own carveouts and hold the segments rather than the metadata. The use_tzmem branch, which would use the TrustZone memory pool instead, is off on this board: needs_tzmem is unset and remoteproc_mpss carries no iommus property, so upstream uses dma_alloc_coherent here too. The board has no DRAM below 0x80000000 at all, the lowest AddMem DRAM row in the UEFI map being 0x811d0000 of 0x30000 bytes with everything else below 4 GiB reserved, so upstream's 32-bit coherent mask cannot be satisfied by an ordinary allocation here; that is exactly what the mainline fuxi port hit, its modem_dtb PAS init returning -12, fixed by CONFIG_ZONE_DMA and CONFIG_ZONE_DMA32. But the width does not explain the refusal: in the PAS matrix the ADSP's metadata at 0x8d0b1f000 was accepted with 0/0 while the modem's at the neighbouring 0x8d0b1e000 was refused, and both are above 4 GiB, so a secure world limited to 32-bit addresses would have refused both. The port's mask (0xfffffffffffff000) is unconstrained where upstream's is 32-bit: a real difference, but not the cause, so the allocation is not changed in this round. One earlier claim is withdrawn: the metadata address was recorded as being outside this board's DRAM, and the UEFI memory map disproves it, since the row DRAM 0x8c0000000 of 0x140000000 covers 0x8C0000000..0xA00000000 and every measured metadata address is inside it.",
"The device run found two real defects in the inventory path, both of which the host test could not see because the test builds its own image and mounts it itself. The first: the probe checked for the firmware partition and gave up before waiting for it, so on the device the check ran in bsd_init, long before the UFS driver was up, and the probe printed 'the firmware partition is not there yet' and stopped. The wait for the partition came after the check, where it could never be reached, so it was dead code; the wait now comes first. The second: the listing stopped at 64 entries per directory, so the run reported 65 entries and the modem's own directory /image/modem_pr was never walked. The cap is now 1024 and the modem's directory is listed too. Both were caught by the device run and not by the host test, which is the case for having both.",
"The RPMh corner the modem's rails are voted to is settled from Linux's own source. Linux's sm8550_mpss_resource carries no proxy_pd_performance_states, so qcom_pas_pds_enable asks for INT_MAX; rpmhpd_set_performance_state walks the level list for the first entry at least as large and steps back one entry when the request is above every level, so the request lands on the highest corner. rpmhpd_power_on votes max(pd->corner, pd->enable_corner), and the enable corner, the first corner with a non-zero level, never exceeds the highest one. Whether the RPMh state has been synchronised makes no difference: the unsynced branch of rpmhpd_aggregate_corner uses level_count - 1 and the synced branch is handed the same corner. Only the active vote reaches the wire at modem start, because __rpmh_write sends only the ACTIVE_ONLY state and the wake and sleep votes stay in rpmh.c's cache until the processor suspends. The port's vote was therefore already correct; what changed is that the rule now lives in one place, package/FuxiRpmhCorner.c, and is pinned by a host test.", "The porting hook's fourth rule was described but never implemented: the state carried an empty defects dict that was written to and cleared but never populated, so nothing was ever blocked. It is implemented now. The defects come from a dedicated section of PORTING_BLOCKERS.md (已发现的缺陷), because the other entries of that document are open questions waiting on a device measurement and must not block the work. A defect listed there blocks the next write of an unrelated file and releases when the defect's own file is written. The notes are the source of truth, so an empty state file cannot release the block and a defect taken out of the document stops blocking at once. scripts/check-porting-rules-host.py exercises the rule in both directions, and the hook was seen blocking a real write of mine while it was still treating every entry of the blockers document as a defect, which is how the over-triggering was found.",
  "The region assignment is done and the secure world accepts it, and the refusal does not change. Linux drivers/remoteproc/qcom_q6v5_pas.c, sm8550_mpss_resource, carries region_assign_idx 2, region_assign_count 1 and region_assign_vmid QCOM_SCM_VMID_MSS_MSA, and the ADSP's entry carries no region_assign_idx, so this is the one structural difference between the two paths. The port now does it, in package/FuxiModemAssign.h and stepAssign(), at upstream's position in the sequence: before any PAS call. The call is the memory-protection service, not the peripheral authentication service: service 0x0c, command 0x16, seven arguments, argument-type word 0x1117. Seven arguments do not fit in SMC64's registers the way the PAS calls do, so the transport is upstream's: the arguments past the fourth go into a separate block of seven 64-bit little-endian values whose physical address is what x5 carries, because the quirk's session register is x6. The block itself has the source owners at 0, the memory to map at 64 and the new owners at 128, 192 bytes in all. Upstream's block does not need secure memory: the TrustZone pool it is taken from is backed by an ordinary coherent DMA allocation unless CONFIG_QCOM_TZMEM_MODE_SHMBRIDGE is on, and that option is off by default and is off in this port's reference kernel config. On the device on 2026-11-20 the call answered scm 0/0: the DSM region was handed from the hypervisor's own owner to the modem's MSA with read and write. The modem's device tree blob's INIT_IMAGE was still refused with the same code as before, 0xFFCFFFBB. The region assignment is therefore not the reason for the refusal, and the analysis document's hypothesis that it was is measured to be false.",
  "The port's PAS sequence is upstream's sequence on this board, and that was checked item by item against the upstream source on 2026-11-20 rather than assumed. The region assignment is done and accepted (scm 0/0) and it is not the reason for the refusal. The three steps' argument-type words match byte for byte (INIT_IMAGE 0x82, MEM_SETUP 0x03, AUTH_AND_RESET 0x01). The metadata comes out of the .mdt file, as upstream's packed branch does. The order matches: upstream's blob INIT_IMAGE is in the start phase, after the rails vote, because upstream's qcom_pas_load is the remoteproc load callback and the remoteproc core calls it from rproc_start, so the port's assignment then rails then PAS is upstream's order. A fixed image gets no MEM_SETUP and its segments are placed from the carveout's physical base, which is what the port does. The carveout addresses match the board's own device tree (mpss_region 0x8a800000 of 0x10800000 and q6_mpss_dtb_region 0x9b000000 of 0x80000). The one item left was the SCM's own clocks and bandwidth, and reading upstream showed the clock half is a no-op here: the sm8550 device tree's scm node carries no clocks property, so upstream's devm_clk_get_optional returns NULL and clk_prepare_enable(NULL) returns 0. So the refusal is not a missing upstream step.",
  "The always-on processor's window is at 0xc300000, not 0xc30000. The port's kAossBase had one hex digit missing, so the QMP mailbox was mapped an MiB below the real one and reading the descriptor killed the kernel. Upstream's sm8550.dtsi gives the aoss_qmp node reg = <0 0x0c300000 0 0x400>, the CAF live device tree gives the same, facts/audio/binding.toml's aoss_base is the same value, and the ADSP probe already maps that value. Measured on the device on 2026-11-20: with the address corrected the QMP descriptor reads out as upstream expects (word 0 is QMP_MAGIC 0x4d41494c, word 1 is QMP_VERSION 1, words 13 and 14 are the mailbox size 728 and offset 296), the handshake opens, the load state message is answered, and the modem comes up.",
  "The bring-up order that worked is upstream's qcom_pas_start order: the blob's INIT_IMAGE and segment copy, the mailbox handshake, the load state message to the always-on processor, the blob's AUTH_AND_RESET, the image's INIT_IMAGE and MEM_SETUP and segment copy, and the image's AUTH_AND_RESET. The load state message goes before the blob's reset, which is where upstream puts it and where the reference port for the same modem (hakios.mpss.c, step_start) puts it too. The earlier round that reordered it and saw a regression was measuring the wrong thing: that run was already stopped at the mailbox, so the difference it showed was not about the order.",
  "Two defects in the bring-up path were found and fixed: qcom_qmp_step was only called from the interrupt handler, so the handshake was never started (the doorbell that asks the always-on processor was never rung), and waitEvents ignored the result of assert_wait_timeout, so every bounded wait was in fact unbounded (the same defect was in package/FuxiAdspProbe.cpp).",
  "The owner thread was stranded after the first seconds, for a reason that was in the port's own wait: waitEvents could return with the pending bits already taken by another path, and it then blocked with no timeout (package/FuxiModemProbe.cpp, the thread_block(THREAD_CONTINUE_NULL) after the woken-but-empty case). The doorbell that woke it had already been accounted for and nothing would wake it again, so the link's service loop stopped. A stopped thread looked exactly like a quiet link, which is why the link looked silent. The wait now returns instead of blocking, and the report says every second whether or not anything moved, so a silent link and a dead thread are told apart.",
  "The name service answered us only after the control packets were given a body. Upstream's QRTR name service does not read the header's type field: it reads the command word at the start of the body (Linux net/qrtr/ns.c, the qrtr_ns_worker switch on pkt->cmd), and the body is a whole qrtr_ctrl_pkt, the command word and a 16-byte union (Linux include/uapi/linux/qrtr.h). The port sent its HELLO with no body at all, so the modem had no command word to read, and upstream's own receive path refuses such a packet outright (af_qrtr.c: if (!size || size > len ...) goto err). Our HELLO was invisible to the modem, and that is why it announced no service. The convention was established from the device, not from reading: the trace hook (qrtr_set_trace) shows the modem's own HELLO is a 52-byte packet whose header says type 2 and size 20 and whose 20-byte body's first word is the command. Every control packet now carries the body, built inside qrtr_send_from so no caller can forget it, and the reply to the peer's HELLO carries our own node id where the peer looks for it. After the change the modem sent a NEW_SERVER (type 4): service 66 (0x42), instance 0xb401, node 0, port 1, and the heartbeat's server count went from 0 to 2.",
  "The modem's open for a channel nobody here serves was answered, and it was not what stopped the modem. The modem opened SSM_RTR_MODEM_APPS, the edge it uses to ask for a subsystem restart, which this port does not serve. Upstream answers such an open: Linux drivers/rpmsg/qcom_glink_native.c allocates a channel for the name in qcom_glink_rx_open and sends the OPEN_ACK, and qcom_glink_create_remote then sends its own OPEN and waits for the acknowledgement. The port only counted it. It now allocates the channel and answers it (package/QcomGlink.c), with no intents on it, because nobody here serves it. The device proved this change was not the reason the modem was silent: the transmit count went up by two, the open was acknowledged, and the modem still announced nothing until the control packet's body was fixed.",
  "Mainline Linux got this same modem running on this same board with this same firmware, which rules the firmware out as the thing the secure world refuses. The mainline port's handover note (/tmp/x13/docs/交接-新会话-20261030-2110.md) records modem12 as the first run where the baseband stayed up for 4584 s and registered on CHN-UNICOM 460-01, and its device tree names the same files from this board's own partition, modem.mdt and modem_dtb.mdt, with the same remoteproc_mpss. So the blobs the port offers are blobs the secure world accepts on this board. What mainline actually had to fix was the metadata's address width: upstream's qcom_scm_pas_init_image allocates the metadata with dma_alloc_coherent, the SCM platform device's mask defaults to 32 bits, this board has no usable coherent region below 4 GiB, dma_alloc_coherent returned NULL and the modem_dtb PAS init answered -12. Mainline's fix was CONFIG_ZONE_DMA and CONFIG_ZONE_DMA32, whose only effect is to let the metadata land below 4 GiB. The port's metadata lands at 0x8d39ab000, above 4 GiB, because the port's mask is 0xfffffffffffff000 and does not constrain the address width at all. The address width alone does not explain the difference between the two blobs, since the ADSP's blob was accepted from 0x8d0b1f000, also above 4 GiB; but it is the one lead that is backed by a working bring-up of this exact firmware on this exact board."]
completion = ["Scanning, association, address configuration and sustained receive/transmit traffic pass with the selected firmware.", "SIM slot 1 is read repeatably (card status, ICCID, IMSI), its registration state and signal metrics are read and refreshed, RF off/on and register/deregister survive 50 cycles each, and airplane mode always takes RF offline."]
limits = [ "The modem's name service does not answer the port's lookups, so the modem's list of services cannot be asked for over the name service. Only the announcement the modem makes on its own initiative reaches the port, and it is two services.", "The modem was started on the device on 2026-11-20: its stage reached 9 (up), all 31 segments were loaded, and the SMP2P ready bit is set. The data plane came up on 2026-11-20: glink_up is 1 and the first HELLO went out, and the name service came up too: the modem announced its services on 2026-11-20 and the heartbeat's server count is 2. What is not established is the rest: no QMI request has gone out to a service yet, so the card 1 SIM has not been read and no signal has been collected, and the RF is still off. The runtime path ran once and stopped at the DTB\u0027s first PAS call, which the secure world refused with 0xFFCFFFBB; The pas matrix then showed the refusal follows the modem's own blob and not the call: the ADSP's blob is accepted by the same code, and every one of the 21 pas ids the secure world knows refuses the modem's blob with the same code. Why the secure world refuses that firmware is still not known.", "The mss.lvl rail is not in this board's command database copy: the copy carries gfx.lvl, mx.lvl, cx.lvl and gmxc.lvl, so the modem's second proxy domain has no level to vote and the probe reports its absence rather than assuming it.", "The cellular plan is documented in docs/fuxi-baseband-plan.md; nothing of it has been implemented or run on the device.", "The LineageOS fuxi board devicetree overlay, which the audio facts use as the board wiring dictionary, is not on this machine, so the board-level RF and SIM wiring is still unknown.", "The modem's SMP2P items and the GLINK item ids come from the board's own CAF device tree and from Linux, but no modem has yet run on this board, so the item ids are unverified at run time.", "No local Linux tree with the IPA v5.5 sources exists yet, so the regenerated endpoint and register tables cannot be produced.", "Whether the modem requests NV or calibration files from the AP at runtime, which would require an rmtfs equivalent, is unknown.", "No upstream step is missing from the modem's PAS sequence any more, and that is now measured, not assumed. Every item of upstream's sequence was checked against the upstream source on 2026-11-20 and the port already matches all of them: the region assignment (upstream sm8550_mpss_resource carries region_assign_idx 2, region_assign_count 1 and region_assign_vmid QCOM_SCM_VMID_MSS_MSA 0xF; the port hands the board's third reserved-memory region, mpss_dsm_mem at 0xd4d00000 of 0x3300000 bytes, to the modem before any PAS call, and the secure world accepted it with scm 0/0 on the device; the refusal did not change, so that step is not the reason), the three steps' argument-type words (0x82, 0x03 and 0x01, byte for byte), the metadata taken out of the .mdt file, the order (the region assignment in the probe, the rails vote, then the blob's INIT_IMAGE and segment load, then the blob's AUTH_AND_RESET, then the modem image the same way; upstream's blob INIT_IMAGE is in the start phase too, after the rails vote, because upstream's qcom_pas_load is the remoteproc load callback and the remoteproc core calls it from rproc_start), the fixed image's placement (no MEM_SETUP, segments placed from the carveout's physical base), and the carveout addresses, which match the board's own device tree. The one item left was the SCM's own clocks and bandwidth, qcom_scm_clk_enable and qcom_scm_bw_enable around every PAS call; reading the upstream source on 2026-11-20 showed the clock part is a no-op on this board, because the sm8550 device tree's scm node carries no clocks property, so upstream's devm_clk_get_optional returns NULL and clk_prepare_enable(NULL) returns 0. The bandwidth part votes the interconnect path that the same node's interconnects property names, and the port's rails vote already happens before the PAS calls. So the port's sequence is upstream's sequence on this board, and the refusal is not a missing step: it follows the modem's own blob, since the ADSP's blob is accepted by the same call shape and every one of the 21 pas ids the secure world knows refuses the modem's blob with the same code 0xFFCFFFBB.", "The IPA raw-IP data path is not implemented for the fuxi; only the QRTR control plane is.", "The four address checks are done and the address width is not the reason for the refusal. (1) 0x8d5acf000 is a physical address: the probe takes it from getPhysicalSegment(0, nullptr, kIOMemoryMapperNone), which returns the descriptor's physical address, not a virtual and not an IOMMU DMA address. (2) The allocating device upstream is the SCM platform device, whose masks default to 32 bits: setup_pdev_dma_masks sets coherent_dma_mask to DMA_BIT_MASK(32) and dma_mask to a DMA_BIT_MASK(32) platform_dma_mask, and qcom_scm_probe sets neither itself. (3) The address travels as a 64-bit value (desc.args[1] is u64), so the SMC encoding does not truncate it; the width constraint upstream is in the allocation, not in the call. (4) Upstream allocates the metadata with dma_alloc_coherent, the coherent DMA API, not CMA and not reserved-memory: the reserved-memory regions are the firmware's own carveouts and hold the segments, not the metadata. The use_tzmem branch, which would use the TrustZone memory pool instead, is off on this board because needs_tzmem is unset and remoteproc_mpss has no iommus property. The board has no DRAM below 0x80000000 at all (../uefi-fuxi's MemoryMapLib.c: the lowest AddMem DRAM row is 0x811d0000 of 0x30000 bytes, and everything else below 4 GiB is reserved), so upstream's 32-bit coherent mask cannot be satisfied by an ordinary allocation here; that is what the mainline fuxi port hit, its modem_dtb PAS init returning -12, fixed by CONFIG_ZONE_DMA and CONFIG_ZONE_DMA32 (docs/交接-新会话-20261030-2110.md in the mainline port). But the width does not explain the refusal: in the PAS matrix the ADSP's metadata at 0x8d0b1f000 was accepted with 0/0 while the modem's at the neighbouring 0x8d0b1e000 was refused, and both are above 4 GiB, so a secure world limited to 32-bit addresses would have refused both. The port's mask (0xfffffffffffff000) is unconstrained where upstream's is 32-bit; that is a real difference but not the cause, so the allocation is not changed this round. If it ever is, the correct mechanism is XNU's mask argument (the NativeAdrenoMemory.cpp idiom, constraining the mask below 4 GiB and letting the allocator choose), not a hardcoded low address over the existing allocation, and it needs its own low DRAM window because the port's 64 KiB one at 0xd0000000 is reserved for the audio path.", "The metadata buffer is cacheable, while upstream allocates it with dma_alloc_coherent, which is non-cacheable (Linux drivers/firmware/qcom/qcom_scm.c, qcom_scm_pas_init_image: the metadata must be physically contiguous, 4K aligned and non-cachable to avoid XPU violations). The port allocates it with IOBufferMemoryDescriptor::inTaskWithPhysicalMask and cleans it to the point of coherency (dc civac) before the SCM call, so the bytes the secure world reads are current, but the mapping is cacheable rather than uncached. The uncached option is not reachable from the IOBufferMemoryDescriptor constructor, so closing this needs an API this round did not look for. The ADSP blob is accepted by the same allocation, so this is not the reason the modem blob is refused, but it is upstream's rule."]
next_action = [ "Find what makes the modem's name service answer, and get the port's source node id to be the one the modem's name service bound to. The one thing that is not yet settled by the evidence is which node the modem's name service is on: the port asks on both 0 and 7907 and neither answers.", "Serve the locator: publish QRTR service 64 on a local port, answer 0x0021 GET_DOMAIN_LIST with the domain table read off the device, and check against Qualcomm's own service_registry_v01.h that the request's TLV 0x01 is the wanted service name before the answer is written.", "S6: bring up the read-only QMI control plane. The name service is up and the modem announced service 66 (0x42) on node 0 port 1; the next step is to identify that service from the port's own records, bind a local port, and send a read-only request. The trace hook prints only the first two packets, so the second announced service has not been dumped and its bytes are not known. ", "S4: start the MPSS over PAS and keep RF off. The PAS ids are confirmed; what remains is the device run.", "Put the modem firmware on the device: DONE. The firmware partition's /image directory holds modem.mdt and modem_dtb.mdt and the split segments modem.b00 to modem.b31; see the device evidence of 2026-11-19. Which of the two slots carries it was measured on the device with the fuxi-modem=12 survey, not assumed.", "Wire the adapter into the boot path: the modem's PAS boot, the IPCC doorbell for the GLINK edge, and the owner thread that calls fuxi_modem_poll. This is done in the probe and the patch; it has not run on the device."]
evidence = [
  { kind = "host", command = "python3 scripts/check.py (in the UniXNU checkout, drivers/QcomBaseband)", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", reference = "package/FuxiModemProbe.cpp", result = "The QRTR model test passes: the header layout, the single-buffer framing with four-byte padding, the HELLO gating of DATA packets, the server table with a hole after DEL_SERVER, and the malformed-packet counter. It found one real bug, the server lookup that stopped at the first `servers` entries and missed a removed server." },
  { kind = "host", command = "./unixnu defconfig fuxi_defconfig; ./unixnu build kernel", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", reference = "board.toml", result = "The kernel links with the baseband archive force-loaded: the prelinked kernel.macho carries _fuxi_modem_start, _fuxi_modem_poll, _fuxi_modem_report, the _qrtr_* entry points and the AppleBaseband classes. The IPA data path symbols resolved once coachz_modem_data_send and coachz_modem_data_receiver were defined for the fuxi." },
  { kind = "device", command = "fastboot flash boot of /tmp/fuxi-baseband.img (kernel.macho sha256 fc04506a22c539daee40c0006d794223454e16c77cb9e6698453781de074bdd0) followed by reboot", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", reference = "evidence/2026-11-18-baseband-first-boot.md", result = "The kernel with libQcomBaseband.a force-loaded boots to launchd: launchd reports 'Early boot complete', no panic, the graphics driver runs its period loop. The baseband bridge itself stays silent, as it must: it publishes nothing until /chosen/coachz-baseband is set." },
  { kind = "host", command = "python3 scripts/check.py (in the UniXNU checkout, drivers/QcomBaseband)", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", reference = "package/FuxiModemPas.h", result = "The integration test drives the real fuxi_modem.c against a fake SMEM region and a fake modem peer: the fake modem opens the IPCRTR channel, grants an intent and sends its own QRTR HELLO. The test checks that the AP's HELLO reaches it as a QRTR_TYPE_HELLO to the broadcast node and the control port with the local node id and an empty body, that the link comes up, that the reply HELLO to the modem's node id is sent, and that the remote node is learned. It fails against the old one-shot HELLO and against the old one-shot reply, and passes against the current code." },
  { kind = "host", command = "python3 scripts/check-fuxi-modem-pas-host.py", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", reference = "package/tests/fuxi_modem_pas_host.c", result = "The PAS order check passes: the blob before the modem image, INIT_IMAGE then MEM_SETUP then AUTH_AND_RESET, MEM_SETUP only for a relocatable image, the PAS ids 4 and 0x26, and success being x0 == 0 and x1 == 0 with nothing else. It fails if the step order is swapped or the success test is loosened." },
  { kind = "host", command = "./unixnu build kernel", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", reference = "patches/xnu/fuxi-modem-probe.patch", result = "The kernel links with the modem probe wired into bsd_init: the prelinked kernel.macho carries _native_fuxi_modem_probe, _fuxi_modem_start, _fuxi_modem_poll, _fuxi_modem_report and _qrtr_flush_hello_reply.."},
  { kind = "host", command = "python3 scripts/check-fuxi-baseband-facts.py", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", reference = "scripts/check-fuxi-baseband-facts.py", result = "The baseband binding has a checker of its own. It confirms that all 45 values bind, every evidence key resolves in the manifest, no confirmed value rests on a design decision, and the board's own device tree still declares the SMP2P pair, the IPCRTR channel, the mss.lvl rail, the remote pid and the modem's interrupt order. Writing it found and fixed three real defects: a dangling evidence key, an entry with no evidence, and a manifest statement that mislabelled the modem's fatal interrupt as 0x77 0x02 when the tree says 0x77 0x00. Each was proved to fail the check when put back." },
  { kind = "host", command = "python3 scripts/check-fuxi-rpmh-corner-host.py", revision = "106daf61ffc0c083e729d0ee90713b6e5d864bf4", reference = "package/tests/fuxi_rpmh_corner_host.c", result = "The RPMh corner rule is pinned by a host test with 14 checks: the highest corner is the last index of the level list (9 for cx.lvl, 6 for mss.lvl), the enable corner is the first non-zero level past Retention (1 for both), the enable corner never exceeds the highest one, a rail without Retention enables at index 0, a Retention-only rail falls back to index 0, a rail without levels has no corner, and the port\u0027s own level-index lookup for a request above every level returns the highest corner. It fails if the highest corner or the Retention skip is broken." },
  { kind = "host", command = "python3 scripts/check-fuxi-rsc-layout-host.py", revision = "0b46452665cea31f11b882d1d2a07c8a20b17f00", reference = "package/tests/fuxi_rsc_layout_host.c", result = "The RSC layout choice is pinned by a host test with 20 checks: a readable id register is believed whatever it says, a zero one becomes the major version 3 this board has, the two layouts really differ, and the board\u0027s layout is the version 3_0 one with its offsets spelled out (stride 24, wait 0x20, control 0x24, status 0x28, enable 0x2c, msgid 0x34, addr 0x38, data 0x3c). It was proved to fail: with the fallback removed it reports 13 failures." },
  { kind = "host", command = "python3 scripts/check-fuxi-modem-pas-host.py", revision = "0b46452665cea31f11b882d1d2a07c8a20b17f00", reference = "package/tests/fuxi_modem_pas_host.c", result = "The PAS check now also pins the split between the header\u0027s steps and the reset step: the header asks for INIT_IMAGE and, only for a relocatable image, MEM_SETUP, and never the reset; the reset is a step of its own and the last one of the full sequence. This is what stops the defect the device path had, where the processor was reset before its segments were in the carveout." },
  { kind = "device", command = "fastboot flash boot of /tmp/fuxi-modem4.img (kernel.macho sha256 d924b64d0c6e66d61811a98e8bca5622045fd5b559990ca1fc5bbb0a9957e31b, boot image sha256 149aa9bbfd8a182c8a740e836e2c474c7b2882e1a48572f6d472d0d07b25784e, kernel args fuxi-adsp=1 fuxi-modem=4) followed by reboot; the modem\u0027s state read over the USB control channel", revision = "0b46452665cea31f11b882d1d2a07c8a20b17f00", reference = "evidence/2026-11-19-modem-runtime-first-boot.md", result = "The RSC layout fix works on the device: the bring-up reached stage 3 (rails-voted), which is the first stage that needs the vote to complete, and the vote went out on the forced major-3 layout and finished. The ADSP\u0027s runtime really is out of the way: the modem\u0027s stepIpcc attached the IPCC line 261 and the RSC line 37 without an exclusive-access failure, which the ADSP\u0027s bring-up would otherwise have taken first. The modem was not started: the secure world refused the modem device tree blob\u0027s metadata with scm 4291821499/0 (0xFFCFFFBB) on the first PAS call, INIT_IMAGE. No RF was touched, no segment was written, and the SMP2P ready and fatal bits are both clear." },
  { kind = "device", command = "fastboot flash boot of the fuxi-modem=1 image followed by reboot; the kernel's read-only inventory listed the partition over the USB control channel", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", reference = "evidence/2026-11-19-modem-firmware-inventory.log", result = "The modem firmware is on the board and found. The partition's FAT volume mounts read-only and its /image directory holds 448 entries, among them modem.mdt (6364 bytes) and modem_dtb.mdt (4044 bytes) and the split segments modem.b00 to modem.b31 with b14 and b30 absent (29 segments in all). The same partition carries the other remote processors' firmware (adsp.mdt, cdsp.mdt, cpusys_vm.mdt, ipa_fws.mdt), so it is a shared image partition and not the modem's alone. /image/modem_pr holds the directories mcfg and so. The probe started no modem and touched no register. The slot this listing read was not stated by the run: the reader takes the first of modem_b and modem_a that carries a FAT volume, so the record's earlier naming of modem_a was an assumption, not an observation." },
  { kind = "device", command = "fastboot flash boot of the fuxi-modem=5 image followed by reboot; the pas matrix ran over the USB control channel", revision = "ce1437fc854a7ab6ea3221937af1d2db252d0be7", reference = "evidence/2026-11-19-modem-pas-matrix.md", result = "The refusal is in the modem's blob, not in the call. The same INIT_IMAGE call was made four ways: the ADSP's device tree blob against the ADSP's pas id 36 was accepted 0/0, while the modem's blob against pas 38 and pas 36 and the ADSP's blob against pas 38 were all refused with 0xFFCFFFBB. The instrument was checked before its answers were used: the support query answers 0/0 for the ids it knows and 0xFFCFFFC0 for ids it does not, and INIT_IMAGE answers 0xFFCFFFE5 for an unknown id. The secure world accepts 21 pas ids and every one of them refuses the modem's blob with the same code. The blob's segment written into its own hole first and the metadata in the packed form were both tried and both still refused. Nothing was reset and no processor was released." },
  { kind = "device", command = "fastboot flash boot of the fuxi-adsp=2 fuxi-modem=0 image followed by reboot; the ADSP bring-up was read over the USB control channel", revision = "7b54c26c63b96109ee3287b262d26231dea67e74", reference = "evidence/2026-11-19-modem-mdt-metadata.md", result = "The ADSP ran on its own, with the modem off, because the two contend for the same IPCC and RSC interrupt lines. Its audio graph opened, prepared, started and streamed (500 periods sent, 496 done, status 0), so the ADSP PAS boot completed and the ADSP own metadata, now built out of the .mdt file by the same changed code path, was accepted by the secure world. This is the regression check for the ADSP side of the change; the modem was not running in this boot." },
  { kind = "device", command = "fastboot flash boot of the fuxi-modem=11 image followed by reboot; the packed form was compared with the split form byte for byte over the USB control channel", revision = "7b54c26c63b96109ee3287b262d26231dea67e74", reference = "evidence/2026-11-19-modem-mdt-metadata.md", result = "The packed and the split forms differ in 0 of 4044 bytes, for both the modem_dtb and the adsp_dtb. So on this board the metadata taken out of the mdt file and the metadata taken out of the joined blob are the same bytes: the change to the mdt source is the right shape against upstream and a byte-wise no-op here, and it is not why the modem blob is refused. The comparison counts the differing bytes and can fail; the earlier claim that the two forms are the same was written with two identical branches and proved nothing, so it was withdrawn. The packed metadata against the pas id 38 gave scm 4291821499/0 and against the pas id 36 gave scm 0/0, the same as the split form." },
  { kind = "device", command = "fastboot flash boot of the fuxi-modem=12 image followed by reboot; the slot survey was read over the USB control channel", revision = "7b54c26c63b96109ee3287b262d26231dea67e74", reference = "evidence/2026-11-19-modem-mdt-metadata.md", result = "Both slots read their own mdt file: 4044 bytes each, next to a 7992 byte joined blob. The two slots mdt files differ in 95 bytes, the first at 585; the same 95 differences appear in the joined blobs at 4533. The same difference seen in two file layouts is the byte-level proof that the two slots hold two different builds, now on the file the metadata is taken from." },
  { kind = "device", command = "fastboot flash boot of the fuxi-modem=13 image followed by reboot; the slot pas was read over the USB control channel", revision = "7b54c26c63b96109ee3287b262d26231dea67e74", reference = "evidence/2026-11-19-modem-mdt-metadata.md", result = "Each slot blob was handed to the secure world with its metadata built out of that slot own mdt file. Both gave scm 4291821499/0 (refused), the same code as before. The changed slot path works; the refusal is unchanged." },
  { kind = "device", command = "fastboot flash boot of the fuxi-modem=4 image followed by reboot; the runtime bring-up was read over the USB control channel", revision = "7b54c26c63b96109ee3287b262d26231dea67e74", reference = "evidence/2026-11-19-modem-mdt-metadata.md", result = "The metadata source is now the mdt file and the refusal is unchanged. The log says the metadata is 4044 bytes at 8d3a3b000, hash 2, fixed, from the mdt file, and the secure world still answers 0xFFCFFFBB (4291821499). The two pas ids are both known to the secure world: the support query answers 0/0 for 38 and for 4. The address the metadata landed at, 0x8d3a3b000, is 35.3 GiB and is ordinary RAM on this board (the UEFI map has DRAM 0x8c0000000 of 0x140000000, covering 0x8C0000000..0xA00000000); what is true is that the board has no DRAM below 4 GiB to fall back to. Nothing was reset, no segment was written, no RF was touched and no partition other than boot was written." },
  { kind = "host", command = "python3 scripts/check-qcom-mdt-host.py", revision = "0b46452665cea31f11b882d1d2a07c8a20b17f00", reference = "package/tests/qcom_mdt_host.c", result = "The metadata source is pinned by a host test with 108 checks. It builds the modem_dtb shape the device reported (an ELF32 with three program headers, the .mdt file 4044 bytes with the hash segment packed behind the 148 byte header part, the joined blob 7992 bytes with the hash segment at 4096) and checks that the metadata built from the .mdt file is the .mdt file byte for byte, that an .mdt whose size does not match the header part plus the hash is refused, and that without an .mdt the joined blob is still used unchanged. The test runs the two cases that a single fixture cannot separate: one in which the .mdt and the joined blob hold the same hash bytes (the two metadata forms then agree, so the change is a no-op byte-wise on such a board) and one in which they hold different hash bytes (the .mdt's hash must win, and the joined form must take its hash out of the .b02 piece, so a read from the wrong file cannot pass)." },
  { kind = "device", command = "fastboot flash boot of the fuxi-modem=12 image followed by reboot; the slot survey and then the fuxi-modem=13 image, each slot's own blob offered to the secure world, read over the USB control channel", revision = "ce1437fc854a7ab6ea3221937af1d2db252d0be7", reference = "evidence/2026-11-19-modem-slot-survey.md", result = "The slot question is closed. The two slots are two distinct partitions on LUN 4 (modem_a at block 5126, modem_b at block 283283, 114688 blocks each) and both carry the modem's firmware, each /image directory holding 443 entries with modem.mdt at 6364 bytes and modem_dtb.mdt at 4044 bytes. The two slots are different builds: their modem_dtb blobs are the same 7992 bytes long and differ in 95 bytes, the first at offset 4533, inside the hash segment. Each slot's own blob was then offered to the secure world with the modem's pas id 38, and both were refused with 0xFFCFFFBB. So neither build is accepted and the refusal belongs to something the two builds share. Nothing was reset, no processor was released, no RF was touched, and no partition other than boot was written." },
  { kind = "host", command = "python3 scripts/check-fuxi-modem-assign-host.py", revision = "12172412615ba0cb6490c0891f4f8d111d4e8595", reference = "package/tests/fuxi_modem_assign_host.c", result = "The region's shape is pinned by a host test that reads the real header, so it changes with it. The check confirms the memory-protection service 0x0c and its assign command 0x16 (and that the call does not go to the PAS service 0x02), the argument-type word 0x1117 with seven arguments read-only and plain in the upstream order, the block's three offsets 0, 64 and 128 and its 192-byte size, the block's bytes (the source owner VMID 3, the region's address 0xd4d00000 and size 0x3300000, the new owner VMID 0xf with permission 0x6, and a zero context and context size), the board's values, and the external block's seven little-endian values (the source list's size 4, the new owners' address, their records' size 24, and four zeros). It fails if the service, the command, the argument word, an offset or a byte is wrong." },
  { kind = "host", command = "./unixnu build kernel", revision = "12172412615ba0cb6490c0891f4f8d111d4e8595", reference = "package/FuxiModemAssign.h", result = "The kernel links with the region's assignment in it and with the metadata's whole-page allocation." },
  { kind = "device", command = "fastboot flash boot of /tmp/fuxi-probe.img (kernel.macho sha256 b7b2586e68591370872e5e56ac2d1c8e945d85d5b249e6c163eaa55874f489c2, boot image sha256 f38a7000faee199b58d505cbe479661d1eb8488938ec93aac1a578601c23d175) followed by reboot; the modem's bring-up was read from the device log and the diagnostic pages over the USB control channel", revision = "cb01134d7b793c9a889859a513f987413bc8b92b", reference = "evidence/2026-11-20-modem-up.md", result = "The modem came up. The always-on processor's window was at 0xc300000 (the port had 0xc30000, one hex digit missing), so the QMP descriptor now reads out as upstream expects (QMP_MAGIC, QMP_VERSION, mailbox size 728 and offset 296), the handshake opens, the load state message is answered, the blob's and the modem image's AUTH_AND_RESET are both accepted, all 31 segments are loaded, and the probe's stage reaches 9 (up) with smp2p_ready=4. glink_up is still 0, so the data plane is not up and no SIM was read." },
  { kind = "device", command = "fastboot flash boot of /tmp/fuxi-instr.img (kernel.macho sha256 a28154450bee0dfa0312fc2a4a3effa4fe91fe09c634ddb1cdaf1f28f2faaace) followed by reboot; the step markers named the stop", revision = "cb01134d7b793c9a889859a513f987413bc8b92b", reference = "evidence/2026-11-20-modem-up.md", result = "The bring-up stopped with the last line being FUXI_MODEM: the mailbox descriptor before the handshake, and the kernel panicked; the bootloader marked the slot unbootable and the device landed in fastboot. The stop was the read of the QMP descriptor, which is how the wrong address of the always-on processor's window was found." },
  { kind = "device", command = "fastboot flash boot of /tmp/fuxi-lowmeta.img (kernel.macho sha256 61f320a1eba3032c7ae0ef57ed52bda6861fb40a62cf6215bf6e1bf6daca319b) followed by reboot; the modem's diagnostic pages were read over the USB control channel", revision = "cb01134d7b793c9a889859a513f987413bc8b92b", reference = "evidence/2026-11-20-modem-low-metadata.md", result = "The metadata's address was the reason for the 0xFFCFFFBB refusal. With the metadata in a fixed window below 4 GiB (0x81480000) the blob's INIT_IMAGE and AUTH_AND_RESET and the modem image's INIT_IMAGE and MEM_SETUP are all accepted and all 31 segments are copied, and the bring-up stops at the modem image's AUTH_AND_RESET." },
  { kind = "host", command = "python3 scripts/check-fuxi-modem-low-meta-host.py", revision = "cb01134d7b793c9a889859a513f987413bc8b92b", reference = "package/tests/fuxi_modem_low_meta_host.c", result = "PASS fuxi_modem_low_meta_test: the window is below 4 GiB and page aligned, the two slots are inside it and do not overlap, the blob's 4044 bytes fit in one page and the image's 6364 in two, and the window overlaps none of the ten regions it must not touch." },
  { kind = "device", command = "fastboot flash boot of /tmp/fuxi-assign2.img (kernel.macho sha256 673e255df76cabbd902ab9432aed630866e2e7f6444f4b1359045ad3be27f176) followed by reboot; the modem's bring-up log read over the USB control channel", revision = "12172412615ba0cb6490c0891f4f8d111d4e8595", reference = "evidence/2026-11-20-modem-region-assign.md", result = "The memory ownership assignment is accepted by the secure world, and the refusal does not change. The DSM region (0xd4d00000 of 0x3300000 bytes) was handed from the hypervisor's own owner (VMID 3) to the modem's MSA (VMID 0xf) with read and write, exactly as upstream's sm8550_mpss_resource asks, and the call answered scm 0/0. The modem's device tree blob's INIT_IMAGE is still refused with the same code as before, 0xFFCFFFBB, with the metadata taken out of the .mdt file. So the region assignment is not the reason for the refusal. This round also found one real defect: the metadata's uncacheable mapping (kIOMapInhibitCache, which becomes MAP_MEM_IO) hangs the modem's thread inside the allocation, before its first print, so the mapping is no longer forced to be uncacheable while the whole-page, page-aligned, zeroed and cleaned allocation is kept." },
  { kind = "host", command = "python3 scripts/check-fuxi-modem-pas-host.py", revision = "14fa158df91a881da4e3a8275e57824b89dbf650", reference = "package/tests/fuxi_modem_pas_host.c", result = "The three steps' argument-type words are now pinned by number, not only by construction, and the pinning caught a mistake in this repository's own notes: the notes said upstream's INIT_IMAGE sends 0x92, but upstream's QCOM_SCM_ARGS(2, QCOM_SCM_VAL, QCOM_SCM_RW) is 2 | VAL<<4 | RW<<6 = 0x82, and the port's encoder already produced 0x82, so the code was right and the note was wrong. The note is corrected. The host check now asserts 0x82, 0x03 and 0x01, so a change to the encoder or to the type words cannot pass unnoticed. The check passes."},
  { kind = "device", command = "fastboot flash boot of /tmp/fuxi-link2.img (kernel.macho sha256 ea2bf0e75b4d340a78717f87665b2f27ed2e8cc0b924228d88dfe5ddd9cca0de) followed by reboot; the modem's bring-up log and the diagnostic pages read over the USB control channel", revision = "4b9aae3b3ad8957223b9a8758801fa144980df7d", reference = "evidence/2026-11-20-modem-link-up.md", result = "The link is up. The GLINK items are there (the descriptor 32 bytes, the two FIFOs 16 KiB each), the adapter took the link, the modem opened the IPCRTR channel, the first HELLO went out, and glink_up is 1 on the diagnostic page with the bring-up at stage 9. The modem's own HELLO came back and the answer to it went out. The card 1 SIM was not read: the modem announced no service (servers 0) and the RF is still off." },
  { kind = "device", command = "fastboot flash boot of /tmp/fuxi-hello.img (kernel.macho sha256 14f44986a4b95a4bcb85023aac3ecbe65540fd3125f4321970d80f14989723a1) followed by reboot; the modem's bring-up log read over the USB control channel", revision = "d177730a1b7bb9f9a16354d81061bee04fc0892c", reference = "evidence/2026-11-20-modem-name-service.md", result = "The name service answers us. The modem sent a NEW_SERVER (type 4): service 66 (0x42), instance 0xb401, node 0, port 1, and the heartbeat's server count went from 0 to 2 (qrtr rx 3 against 1 before, glink rx data 3 against 1 before). The diagnostic pages still say glink_up 1, stage 9, last_error 0, smp2p_ready 1. The card 1 SIM was not read: no QMI request has gone out yet, and the RF is still off." },
  { kind = "device", command = "fastboot flash boot of /tmp/fuxi-loc2.img (kernel.macho sha256 9d4620ebfab2017c9545f92595fb9b28e33bb5210a550bbd6ae1c956d94a6c01) followed by reboot; the modem's log read over the USB control channel", revision = "e847885a9da9f730066fe3417acc0f1ffa36af7f", reference = "evidence/2026-11-21-modem-service-lookup.md", result = "The modem publishes exactly two services and answers no lookup at all. In 3110 seconds of runtime the modem sent four packets: a HELLO, a NEW_SERVER for SERVREG_NOTIF (0x42, instance 0xb401, node 0, port 1), a NEW_SERVER for SSCTL (0x2b, instance 0x1202, node 0, port 4), and the answer to the failure-reason request. The two NEW_SERVERs arrived after all fourteen of the port's named lookups had already gone out, so they are the modem's own announcement (upstream's announce_servers, in answer to a HELLO) and not an answer to anything. The wildcard lookup was re-asked every two seconds on both of the nodes the peer named, for 3110 seconds, and was never answered: the count of lookups answered stayed at 2, which are the two announced services, and the empty NEW_SERVER that ends a listing never came. The locator, service 0x40, was asked for in the exact form upstream's protection-domain mapper uses (version 1, instance 1) and got no answer either. The modem's own SMP2P holds two entries and no more: smp2p (value 0x0) and slave-kernel (value 0x6, the ready bit and the handover bit). UIM (0x0b), NAS (0x03), WDS (0x01) and DMS (0x02) are not published, so the card 1 SIM was not read." },
  { kind = "host", command = "python3 drivers/QcomBaseband/scripts/check.py (in the UniXNU checkout)", revision = "c190777715eeadc989d127634128c6838ce7cba6", reference = "evidence/2026-11-21-modem-service-lookup.md", result = "The QRTR model test passes. A service the modem published counts as an answer, not only the empty NEW_SERVER that ends a listing: the counter moved only for the empty one before, so it stayed at zero on a modem that answers with services. The test now expects two answers for a listing of one service plus the terminator. The host model gains the clock the adapter needs (scripts/xnu-stubs/kern/clock.h), so the adapter's millisecond count is built and run on the host." },
  { kind = "device", command = "fastboot flash boot of /tmp/fuxi-loc2.img followed by reboot; the modem's log read over the USB control channel", revision = "c7f6c2bcbe8f6a975398d8efb4e7a4876194da79", reference = "evidence/2026-11-21-modem-service-lookup.md", result = "The safe request keeps the modem up. The earlier sweep asked the SSCTL service for each of its message ids one id a second, and two of those ids (0x0020 restart, 0x0021 shutdown) stop the modem, which is why the modem went quiet. The request that is sent now is 0x0022, the failure reason, which takes no TLVs and only reads: the modem stayed alive for the whole run, answered with error 94 (QMI_SERVICE_ERR_NOT_SUPPORTED, the modem has not failed, which is the answer the request was built to get), carried one TLV of type 0x02, and the QRTR flow stayed at one packet pending instead of freezing at ten." },
  { kind = "device", command = "fastboot -s b4c62a1e flash boot /tmp/fuxi-jsn-dump.img followed by reboot; the fuxi-modem=14 probe read the file over the USB control channel", revision = "REVISION", reference = "evidence/2026-11-21-modem-registry-table.md", result = "The dump succeeded: image/modemr.jsn is 710 bytes and every byte of it was recovered from the capture, the hex column and the ASCII column agreeing. The table names one domain, msm/modem/root_pd with qmi_instance_id 180, and two services in it, tms/servreg and gps/gps_service, both with service_data_valid 0. The mode is read only: the capture holds no FUXI_MODEM: step: line, so no rail was voted, no window mapped and no register written. Kernel sha256 7251ddb0fb7a35f093775a0083136a8632643b1e181c72c32fef06a1c453eba6, boot image sha256 768386b4f178c7f42e27d4f3da1a47e21792b16abd350ca02a59b199e5a17bbc, run-20261121-155640." }
]

[[area]]
id = "audio"
status = "host-verified"
components = []
paths = ["package/*Adsp*", "package/*AudioPath*", "package/*Cs35l41*", "package/*AudioTopology*", "package/*AudioRing*", "package/QcomAudioService.*", "package/QcomAudioAbi.*", "package/tests/qcom_audio_abi_host.c", "package/tests/qcom_audio_service_host.c", "package/tests/*ring*", "package/tests/*topology*", "package/tests/*audio_path*", "package/tests/*cs35l41*", "package/*Audio*", "package/*Gpr*", "package/*Cs35l41*", "package/tests/*gpr*", "package/tests/qcom_audio_graph_host.c", "package/tests/*a0*", "package/tests/*mdt*", "package/*Glink*", "package/*Smem*", "package/*Smp2p*", "package/*Mdt*", "package/*Qmp*", "package/*Rpmh*", "package/*Scm*", "package/tests/*loader*", "package/tests/*adsp*", "package/*Adsp*", "facts/audio/**", "scripts/check-fuxi-audio-binding.py", "scripts/*adsp*", "scripts/*audio*", "scripts/*gpr*", "package/QcomAdspClient.*", "package/QcomAudioCapture.*", "package/QcomAudioGraph.*", "package/QcomAudioTopology.*", "package/QcomAudioPath.*", "package/QcomAudioRing.*", "package/Cs35Run.*", "package/ShengGpr.*", "package/GeniI2c.*", "package/FuxiCs35l41.*", "package/FuxiAmpBringup.*", "package/tests/fuxi_cs35l41_host.c", "package/tests/fuxi_amp_bringup_host.c", "scripts/check-fuxi-cs35l41-host.py", "scripts/check-fuxi-amp-bringup-host.py", "hal/*", "scripts/build-fuxi-audio-hal.py", "scripts/report-fuxi-hal-audit.py", "scripts/check-qcom-audio-fuzz-host.py", "scripts/check-fuxi-audio-records.py", "package/tests/qcom_audio_fuzz_host.c", "package/FatVolume.*", "package/FuxiAdspFirmware.*", "package/FuxiGraphReply.*", "package/tests/fuxi_audio_binding_host.c", "tests/fuxi_graph_reply_host.c", "scripts/check-fuxi-audio-runtime-binding.py", "scripts/check-fuxi-graph-reply-host.py", "scripts/gen-fuxi-audio-binding.py", "scripts/prepare-fuxi-audio-firmware.py", "scripts/build-fuxi-audio-runtime.py"]
inputs = ["The fuxi ADSP firmware and its board-specific memory/interrupt inputs.", "Two CS35L41 amplifiers and the WCD938x codec described by the fixed fuxi device-tree source."]
configuration = ["board.toml builds an independent libFuxiAudioRuntime.a and fuxi_defconfig force-loads it. bsd_init reaches native_audio_probe, which is inert unless fuxi-adsp is supplied; mode 1 publishes only the generated board binding and mode 2 is reserved for the complete Sheng-derived hardware hook set."]
procedure = [
  "Run scripts/prepare-fuxi-audio-firmware.py <fuxi-firmware checkout> to pin the CS35L41 inputs and inventory the two required PAS images; use --require-adsp for a runtime image.",
  "Run scripts/check-fuxi-audio-runtime-binding.py after changing binding generation or the runtime ABI.",
  "Run scripts/check-fuxi-audio-binding-selftest.py whenever the binding gate changes: a gate that is never tested can quietly stop gating.",
  "Run scripts/check-qcom-smem-alloc-host.py for H6 - the exact byte diff an allocation may make, and the proof that it leaves the payload alone.",
  "Run scripts/check-qcom-tcsr-hwlock-host.py for the TCSR mutex encoding taken from the mainline driver, not from guesswork.",
  "Run scripts/check-qcom-mapping-host.py for the mapping helper contract - alignment, length, offset and unmap symmetry (debug runbook H8).",
  "Run scripts/check-qcom-hwspinlock-host.py for the bounded hardware spinlock policy (debug runbook H7).",
  "Run scripts/check-fuxi-audio-probe-h5.py for the SMEM parser corpus (debug runbook H5).",
  "Run scripts/check-fuxi-audio-probe-h0.py to prove the default boot path reaches only the fuxi-adsp-gated entry (debug runbook H0).",
  "Run scripts/check-cirrus-cs35l41-host.py after changing the amplifier programs or the safety gate.",
  "Run scripts/check-fuxi-cs35l41-host.py after changing the fuxi CS35L41 program tables (package/FuxiCs35l41.c).",
  "Run scripts/check-fuxi-amp-bringup-host.py after changing the amplifier bring-up plan (package/FuxiAmpBringup.c): the QUP2 votes, the branch state rule and the pin and clock words.",
  "Run scripts/check-fuxi-graph-reply-host.py after changing the bounded APM graph reply matcher.",
  "Run scripts/check-fuxi-audio-binding.py after changing any audio configuration field; a consuming build must pass --require-verified.",
  "Run scripts/check-fuxi-audio-sheng-refs.py <sheng checkout> after changing any value the binding takes from the reference implementation.",
  "Run scripts/check-fuxi-audio-facts.py after changing the board facts.",
  "Run scripts/fuxi-audio-device.sh before any device work: it reports fastboot, serial or absent with an exit code that matches, because the owner decides which state the phone is in.",
  "Run scripts/fuxi-audio-s0.sh once per stable boot; three records in facts/audio/s0-boots.txt are S0's gate.",
  "Run scripts/check-fuxi-audio-records.py after changing moving, renaming or deleting a file this area declares.",
  "Run scripts/check-geni-i2c-host.py after changing the GENI I2C core (sheng's, copied unchanged).",
  "Run scripts/check-gpr-host.py after changing the packet codec or the framework readiness query.",
  "Run scripts/check-qcom-a0-host.py after changing SMEM, SMP2P or GLINK.",
  "Run scripts/check-qcom-adsp-client-host.py after changing the DSP client registry or its queue.",
  "Run scripts/check-qcom-adsp-host.py after changing the ADSP bring-up order or its stage ladder.",
  "Run scripts/check-qcom-audio-abi-host.py after changing the shared page, its layout or its timeline.",
  "Run scripts/check-qcom-audio-capture-host.py after changing the capture accounting.",
  "Run scripts/check-qcom-audio-fuzz-host.py after changing any parser that reads bytes it did not produce.",
  "Run scripts/check-qcom-audio-graph-host.py after changing any AudioReach command.",
  "Run scripts/check-qcom-audio-path-host.py after changing the silent data path, its transactions or its period window.",
  "Run scripts/check-qcom-audio-ring-host.py after changing the shared output ring or its period accounting.",
  "Run scripts/check-qcom-audio-service-host.py after changing the service's IO cycle, page publishing or restart order.",
  "Run scripts/check-qcom-audio-topology-host.py after changing the speaker topology builder.",
  "Run scripts/check-qcom-loader-host.py after changing the AOSS QMP handshake or the RPMh vote.",
  "Run scripts/check-qcom-mdt-host.py after changing the signed firmware container parser.",
  "Run scripts/report-fuxi-audio-status.py to regenerate the plan's status table from the suites themselves.",
  "Run scripts/report-fuxi-audio-probe-reads.py to list what a device session has to read to settle the fields that have no source yet.",
  "Run scripts/report-fuxi-hal-audit.py to list what the plug-in tells the audio server and what the 21H461 audit must confirm.",
  "Run scripts/build-fuxi-audio-hal.py to build and ad-hoc sign the plug-in (needs Xcode's iPhoneOS and macOS SDKs).",
]
findings = ["Fixed fuxi source revision 43b5ada5654ed84c25f74789bc8f6326b7bacd20 describes two CS35L41 amplifiers on QUP2 SE0 I2C: B at 0x40 with reset GPIO183 and IRQ GPIO99, and T at 0x42 with reset GPIO182 and IRQ GPIO98. This is source evidence, not a device observation.", "The same source describes secondary TDM/MI2S on GPIO121/123/122/124 with at most four slots, and a WCD938x codec on the SM8550 audio complex. Stream format, slot masks and the primary microphone route remain unverified.", "Linux mainline commit fa4ad798f6f681031775266044ba1b0cf3c670bd shows that safe CS35L41 bring-up requires OTP boot/error handling, device/revision validation, revision errata and OTP trim, boost validation, power completion handshakes and critical-fault recovery. Its GPL implementation is a semantic reference and is not copied here.", "QcomHalAbi is the block the kernel audio service and the user-space HAL share: magic, version, the producer's own structure size and the output ring's description, with the field offsets asserted at compile time so a rearrangement breaks the build instead of the other side. qcom_hal_abi_validate() refuses a block before any field is interpreted - wrong magic, a version this side does not read, a producer that compiled a different size, an input ring while the version publishes output only - and the validator also refuses the plan's own suggested pair of a 65536-frame ring with a 480-frame period, because 480 does not divide 65536.", "QcomAudioSession is the recovery order: the ADSP comes up, the data path follows, and a restart mutes the amplifiers first, moves to a new generation and then rebuilds both layers, emptying the ring on the way. A restart whose mute fails does not happen at all - the session is marked failed and the generation stays where it was - so nothing can be unmuted across a restart. Its host model runs the whole stack (Mdt, Qmp, Smp2p, Glink, Gpr, AudioReach, Adsp, Path) with the AOP and the DSP simulated, and checks that an answer carrying the previous generation's token is ignored.", "QcomAudioRing is the shared output ring and its period bookkeeping: two indices over one buffer, one frame always left free so a full ring is distinguishable from an empty one, and the counters the acceptance record asks for - periods completed, periods that finished after their deadline (late, with the worst delay kept), periods the consumer could not fill (underrun, with the shortfall), periods deliberately filled with silence, and overruns where a producer tried to write into a full ring. The ring's size, period, format and host clock are all configuration; the 19.2 MHz timeline and the 65536-frame ring the plan mentions are therefore values, not constants.", "QcomAudioTopology assembles the speaker graph, endpoint and format from explicit inputs - module instances and ids, the interface, the sample format, the frame length and which slots each amplifier carries - and refuses a mapping that cannot be right: overlapping slots, slots outside the frame, a channel count that disagrees with the masks, a width the endpoint cannot take, a zero rate, two modules on one instance. The caller owns the assembled structure, so the graph points into it rather than at anything static.", "facts/audio/binding.toml is the board binding field by field: every configuration field of QcomAdsp, QcomAudioPath and CirrusCs35l41 appears with a value, a state and the fact it rests on. scripts/check-fuxi-audio-binding.py refuses the three ways an unverified value could reach a build - a verified entry whose evidence is missing or still unverified, and a layer field the binding leaves out - and with --require-verified it refuses every unverified entry, which is what a consuming build must do. All 78 entries are unverified today and the build does not consume the binding yet.", "CirrusCs35l41 is the amplifier bring-up as a safety sequence rather than a register dump: the binding supplies the register map and the values to program, the hooks supply the two wires and the reset line, and the state machine only guarantees the order - identity before configuration, faults cleared before configuration, every configuration write read back, PLL locked and the amplifier muted before MUTED_READY, and unmuting refused unless verified, configured, locked and fault free. Its host model drives a register-level device and checks each refusal, including a hundred reset/identify/configure/mute cycles.", "The audio line has its first device evidence: the read-only SMEM probe ran on 2026-11-09 (fuxi-audio-probe=1, kernel afb4edb6) and reported the APPS/ADSP partition at offset 0x19f000 with size 0x60000 and cacheline 32, the GLINK descriptor allocated at 0x19f030 (32 bytes) and the GLINK transmit FIFO at 0x19f060 (16384 bytes, the 0x4000 the platform documents), while the SMP2P out and in items, the crash item and the GLINK receive FIFO are not allocated yet - which is what a read-only probe sees before the APPS side creates them. It also exercised package/QcomSmem.c against this board's table, which had only run against the host model.", "Two of the plan's acceptance shapes now run in the host model: a hundred start/stop cycles, each opening the graph, handing one period over and taking it down again, and twenty restarts, each muting the amplifiers once, moving the generation and rebuilding both layers. Both loops assert their invariants once at the end rather than per iteration - no timeout, nothing left mapped, no period in flight, every period handed over either completed or still owed - so a failure is a failure of the shape, not of one iteration.", "The data path had no teardown: it opened a graph, mapped a buffer and never stopped the graph, closed it or unmapped the buffer. qcom_audio_path_stop() now walks that teardown one step at a time - stop, close, unmap - with the same single-transaction machinery as the bring-up, so a stop requested early is completed rather than skipped and the buffer cannot stay mapped across a start/stop cycle. The service drives it from stop_output and keeps stepping until the path reports idle.", "QcomAudioPath keeps up to four periods in the DSP's hands at once and matches each answer by the buffer address the period was written to, so completions, late answers and cancelled periods are counted separately. The address also advances a cursor through the mapped buffer: two periods never carry the same address, which is what makes the match unambiguous.", "QcomAudioPath is the silent AudioReach data path: framework readiness, graph open, endpoint and stream configuration, buffer map and graph start, then periods written into the mapped buffer. One transaction is outstanding at a time and carries a token whose upper byte is the restart generation, so a reply from before an ADSP restart can never be applied to the new bring-up. Its host model runs the real GLINK, GPR and AudioReach layers with a simulated DSP that answers each command, so every failure mode - a framework that never reports ready, a refused configuration, an unanswered command, a reply for nothing outstanding, a restart generation - is a test rather than a claim.", "QcomAdsp is the bring-up order as a state machine that never waits: placement of every loadable segment into the carveout, the owner's authentication and memory hooks, the mailbox request, the DSP's ready bits, then the link. Every board value - carveout, entry names, ready and fatal bits, the load-state text, the three timeouts - arrives in QcomAdspConfig, and the two steps that need hardware are hooks, so the host model runs the real layers underneath it and injects each failure.", "QcomQmp is the AOSS mailbox handshake as a state machine that never waits: the descriptor checks, the four link/channel steps with their kicks, one text message at a time, and the already-open case a boot stage can leave behind. QcomRpmh looks a resource up in a copy of the AOP command database and describes the register writes of one active-only request in an RSC TCS for both register layouts (the RSC's major version 3 moved them). Neither carries a board address; the plan omits QcomScm from the host tests because it only declares the secure-call shapes.", "QcomMdt parses the container the peripheral authentication service takes: the ELF and program headers handed to the secure world, the hash segment it authenticates, the loadable extent and where each segment goes in a carveout, and the split .bNN form read as one image. Its host model builds a real ELF64 image and checks every refusal. QcomSmem, QcomSmp2p and QcomGlink are the board-independent A0 transport layers taken from UniXNU-sheng's common line: the SMEM table and partitioned item allocator, the SMP2P outbound/inbound item bookkeeping, and the native GLINK protocol (version handshake, channel open, intents, data, done) over a pair of SMEM FIFOs. scripts/check-qcom-a0-host.py drives them under ASan/UBSan, including two GLINK instances against each other over shared FIFOs so the handshake and the data path are exercised by the protocol itself.", "QcomAudioReach builds the APM command payloads (graph open, start/stop/close, endpoint and stream configuration, clock vote, shared-memory map) and interprets the answers, with every graph id, module instance, interface index, clock id and slot mask supplied by the caller. Its host model runs under ASan/UBSan and checks that two topologies produce two packets and that no sheng board value appears in the output.", "QcomGpr implements only board-independent GPR packet encoding/decoding and the APM SPF-readiness transaction model. It contains no firmware path, MMIO address, graph topology or fuxi runtime claim; those remain inputs of later evidence-backed layers.", "The audio line follows sheng's mechanism: GeniI2c, ShengGpr and the Cs35Run step runner are sheng's files copied byte for byte with the sha256 compared, QcomAudioGraph is sheng's command surface with the board taken out, and QcomAdspClient, QcomAudioAbi and the CoreAudio plug-in follow sheng's shapes with fuxi's identity. Three layers of my own were deleted rather than kept beside them: QcomGeniI2c, QcomGpr and QcomAudioReach.", "The DSP's module and interface identifiers were invented at first (PCM_DEC 0x0700100C, I2S_SINK 0x0700101A, and an interface type enum that does not exist). sheng's protocol constants are the real ones: PCM_DEC 0x07001005, PCM_CNV 0x07001003, I2S_SINK 0x0700100A, CODEC_DMA_SOURCE 0x07001024, with LPAIF and LPAIF_RXTX as the interface words.", "hal/FuxiAudioPlugIn.c builds and ad-hoc signs under -Wall -Wextra -Werror against Xcode's iPhoneOS sysroot with the macOS CoreAudio headers (CDHash 8c96f3ca here). That is a build, not a run; the 21H461 ABI audit - twenty-four items listed by scripts/report-fuxi-hal-audit.py - and every device check are still ahead.", "The plan's suggested 65536-frame ring with a 480-frame period cannot both hold, because 480 does not divide 65536. The page validator refuses the pair, the test states it, and the board configuration uses whole periods.", "The binding's fields now each say where they came from: eight cite a recorded source-confirmed fact (the two amplifiers' I2C addresses, reset and IRQ lines and boost values), eight are predictions from sheng checked against its source, and ninety-one have no source yet. The gate also refuses a field whose value disagrees with its cited fact, which found six fields carrying zero while their evidence said 0x40, 183, 99, 0x42, 182, 98.", "Eight of the binding's fields no longer read zero: the ADSP carveout (0x9ea00000 + 0x4680000), the SMP2P entries master-kernel and slave-kernel, their ready and fatal bits (0x2 and 0x1) and the load-state request now carry sheng's SM8550 values, marked unverified and evidenced as cross-board predictions. scripts/check-fuxi-audio-sheng-refs.py reads them back out of sheng's AdspProbe.cpp so a mistyped prediction fails instead of being discovered on the device; without a reference checkout it reports that it skipped.", "Host-side verification is complete and cannot go further alone: sixteen suites, about twenty thousand checks, all board-independent, while every value in facts/audio/binding.toml stays unverified. What remains for A0 to A6 is the ADSP firmware, the device authorisation, and the measurements that follow from them.",
  "P4 read the two CS35L41 amplifiers on the device. The clock votes, the pins, the serial engine and the identity all passed, one stage at a time, with the amplifier left powered down: the QUP2 SE0 engine answered 0x35a40 on both addresses 0x42 (T) and 0x40 (B), revision 0xb2, and the OTP boot done bit was set. This is a device observation of identity only - no sound was produced, the amplifier was never unmuted, and the secondary TDM link is still untested.",
  "The QUP2 clock vote is five bits of the second vote register (0x52010, 0x1f), not the ten halt registers the first version watched: gcc-sm8550.c puts every QUP wrapper 2 branch there and leaves the wrapper 1 branches, which the touch driver owns, in the first. The first vote register is not written at all.",
  "The branch state rule is Linux's, not a stricter one: clk-branch.c skips the halt check entirely for a branch in hardware clock gating mode, and gcc-sm8550.c puts the two QUP2 AHB branches in that mode. Reading their halt bit as if the clock were off reports a working clock as broken - which is exactly what the first level 2 run did.",
  "The amplifier program tables and the GENI I2C core are Kerfand's UniXNU-Fuxi-Arm64e-iOS17 (BSD-2-Clause-Patent), reused byte for byte with the board facts taken from this board's own device tree. The clock values are not Kerfand's: its GeniI2c.c never touches the clock controller and assumes the boot loader left the serial engine configured, so the votes and the DFS level came from Linux's gcc-sm8550.c for this SoC instead."]
completion = ["Each declared route carries the selected audio format through playback or capture and handles start/stop correctly."]
limits = ["The device graph OPEN, endpoint SET_CFG and CLOSE completed with status 0; PCM buffers, graph start, amplifier transactions, speaker output, microphone capture and CoreAudio routing remain untested on the device.", "The earlier GRAPH_OPEN trial lost CDC; the corrected trial and endpoint trial retained CDC, but future graph actions must be bounded and explicitly enabled."]
next_action = ["Bring up the playback stream graph and silent PCM period completions, then identify and configure both CS35L41 amplifiers while muted. The full speaker acceptance still requires an audible short tone and fault-free shutdown."]
