  { kind = "host", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", command = "python3 scripts/prepare-fuxi-audio-firmware.py .cache/fuxi-firmware", reference = "scripts/prepare-fuxi-audio-firmware.py", result = "PASS 11 amplifier inputs; PARTIAL ADSP inputs because both PAS images are absent from the repository" },
  { kind = "host", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", command = "python3 scripts/check-fuxi-audio-facts.py", reference = "scripts/check-fuxi-audio-facts.py", result = "The checked-in board facts reject CS35L43/shared-reset substitutions and preserve the runtime evidence boundary" },
  { kind = "host", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", command = "python3 scripts/check-fuxi-audio-runtime-binding.py", reference = "scripts/check-fuxi-audio-runtime-binding.py", result = "PASS FuxiAudioBinding: 13 checks, 131 fields (73 unverified, 58 chosen, 0 verified)" },
  { kind = "host", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", command = "./unixnu defconfig fuxi_defconfig -D ../unixnu-fuxi && ./unixnu build kernel -D ../unixnu-fuxi", reference = "package/FuxiAdspProbe.cpp", result = "Kernel, generated binding and independently force-loaded Fuxi audio runtime archive compile and link" },
  { kind = "device", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", command = "boot with fuxi-adsp=1", reference = "docs/fuxi-audio-porting-log.md", result = "After moving NativeUfs GPT scratch storage out of the kernel stack, the device reaches launchd and CDC remains responsive; GPU fences retire 18/18 and GOP offers complete 3/3. DIAGSTATUS resources=0x300 proves bsd_init entered native_audio_probe and PE_parse_boot_argn found fuxi-adsp, but did not distinguish the parsed value or runtime return. Added persistent bits for parsed mode, runtime call/return, stats ABI/result/error, and both parsed MDT images for the next one-shot boot." },
  { kind = "device", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", command = "fastboot boot boot.img (fuxi-adsp=1, deferred inventory)", reference = "docs/fuxi-audio-porting-log.md", result = "DIAGSTATUS resources=0x1b1f00 proves mode 1 entered and returned, the asynchronous inventory completed with stats ABI/result set and no error, and both adsp_dtb and adsp split containers parsed successfully from the device-local modem_a/modem_b FAT image. NativeUfs published both roots and launchd reported Early boot complete; the inventory no longer blocks bsd_init or CDC." },
  { kind = "host", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", command = "python3 scripts/check-gpr-host.py", reference = "scripts/check-gpr-host.py", result = "PASS GPR: 37 checks under AddressSanitizer and UndefinedBehaviorSanitizer" },
  { kind = "source", reference = "docs/fuxi-audio-mainline-audit.md", result = "CS35L41 and AudioReach implementation gates derived without copying GPL source" },
  { kind = "device", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", command = "fastboot flash boot + reboot with fuxi-amp=2", reference = "docs/fuxi-audio-porting-log.md", result = "QUP2 level 2 passed: GPLL0 locked (mode 0xe0000005, bit 31), the second vote register took 0x00010000 -> 0x0001001f, and all five wrapper 2 branches read running (core 0x4000, core_2x 0x4000, s0 0x4000; the two AHB branches are hardware gated, which Linux never waits for). No reset." },
  { kind = "device", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", command = "fastboot flash boot + reboot with fuxi-amp=3", reference = "docs/fuxi-audio-porting-log.md", result = "QUP2 level 3 passed: the I2C pins GPIO0/1 moved from 0x00000001 to 0x0000000b (pull-up, function 2 = qup2_se0, 2 mA) and the two reset pins GPIO182/183 from 0x00000801 to 0x00001bc0 (GPIO function, 16 mA, output enabled, eGPIO claimed) with their I/O registers reading 0x03 (input high, output high), so both resets were released. No reset." },
  { kind = "device", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", command = "fastboot flash boot + reboot with fuxi-amp=4", reference = "docs/fuxi-audio-porting-log.md", result = "QUP2 level 4 passed: the SE0 RCG reports DFS enabled at level 0 (dfsr 0x21), GENI_FW_REVISION reads 0x303 so the protocol field is 3 (I2C) instead of the all-zero block seen before the clocks were voted, the engine clock divider is 0x21 and the SCL counters are 0x00502c16 (5/11/22 for 400 kHz from 19.2 MHz), and geni_i2c_prepare returned 0. No reset." },
  { kind = "device", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", command = "fastboot flash boot + reboot with fuxi-amp=5", reference = "docs/fuxi-audio-porting-log.md", result = "QUP2 level 5 passed: both amplifiers answered over I2C with device id 0x00035a40 (CS35L41), revision 0x000000b2, IRQ1_STATUS4 = 0x03 and IRQ1_STATUS3 = 0x20000000; found mask 3 means both the 0x42 (T) and the 0x40 (B) part were identified. The init program leaves them powered down, so no sound was produced." },
  { kind = "host", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", command = "python3 scripts/check-fuxi-amp-bringup-host.py", reference = "scripts/check-fuxi-amp-bringup-host.py", result = "PASS fuxi_amp_bringup_host: 42 checks, including the hardware-gating rule that the first device run got wrong" },
  { kind = "host", revision = "fec918520c0a9211f055d41832ccff58e88a98a4", command = "python3 scripts/check-fuxi-cs35l41-host.py", reference = "scripts/check-fuxi-cs35l41-host.py", result = "PASS fuxi_cs35l41_host: 416 checks, including that the init program identifies the part before configuring it and leaves the amplifier powered down" },
